[project]
name = "fsp-platform-api"
version = "0.1.0"
description = "Платформа-агрегатор ИТ-вакансий с верифицированным профилем участника ФСП"
authors = [
    {name = "IDaniil228", email = "99666220+IDaniil228@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.142.2,<0.143.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.0.36,<3.0.0)",
    # psycopg 3 умеет и синхронно (Alembic), и асинхронно (FastAPI) — один драйвер на оба режима
    "psycopg[binary] (>=3.2.3,<4.0.0)",
    "alembic (>=1.14.0,<2.0.0)",
    "pgvector (>=0.3.6,<0.4.0)",
    "pydantic-settings (>=2.7.0,<3.0.0)",
    "httpx>=0.28,<0.29",
    "argon2-cffi>=25.1,<26",
    "PyJWT>=2.10,<3",
    "email-validator>=2.2,<3",
    "python-multipart>=0.0.20,<0.1",
    "pypdf>=6,<7",
    "weasyprint>=68.1,<69",
    "markdown-it-py>=4.2,<5",
    "mdit-py-plugins>=0.6,<0.7",
]

[dependency-groups]
dev = [{include-group = "demo"}, "pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]
demo = ["Faker==40.43.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[project.scripts]
fspdb = "app.db.cli:main"

[tool.poetry]
packages = [{ include = "app" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
