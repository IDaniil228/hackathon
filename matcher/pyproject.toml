[project]
name = "matcher"
version = "0.1.0"
description = "Сервис подбора кандидатов под потребность работодателя"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "httpx",
    # Нужны копии модулей taskgen в src/matcher/llm: markdown.py разбирает ответы моделей.
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.16.10",
]

[project.scripts]
matcher = "matcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: нужна своя база api с ролью matcher, см. tests/integration/conftest.py",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
