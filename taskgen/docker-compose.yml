# Сервис поднимается автономно: своя песочница, своя база на общем сервере Postgres из db/.
# LLM — на хосте или в профиле ollama. Корневой docker-compose.yml подключает этот файл,
# и тогда taskgen работает в сети платформы; порт на хосте 8001, потому что 8000 занят api.
include:
  - ../db/docker-compose.yml

services:
  # Роль, база и расширение для taskgen: db-init.sql. Другое имя базы, например для тестов
  # своего worktree: docker compose run --rm -e TASKGEN_DB_NAME=<имя> taskgen-db-init.
  # Роль и пароль совпадают с адресом базы у сервиса taskgen ниже.
  taskgen-db-init:
    image: pgvector/pgvector:pg18
    depends_on:
      postgres: {condition: service_healthy}
    # Суперпользователь сервера базы
    env_file: ../.env
    environment:
      PGHOST: postgres
    volumes: ["./db-init.sql:/db-init.sql:ro"]
    command:
      - sh
      - -c
      - >-
        PGUSER="$$POSTGRES_USER" PGPASSWORD="$$POSTGRES_PASSWORD"
        exec psql -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1
        -v role=taskgen -v password=taskgen -v db="$${TASKGEN_DB_NAME:-taskgen}"
        -f /db-init.sql

  piston:
    image: ghcr.io/engineer-man/piston
    # Piston изолирует запуски через Isolate (namespaces и cgroup v2), ему нужен privileged.
    privileged: true
    environment:
      # По умолчанию Piston обрывает запуск после 1 КБ вывода, а протокол обвязки тестов
      # печатает ответ на каждый кейс.
      PISTON_OUTPUT_MAX_SIZE: 4194304
      # Это потолок для лимитов из запроса, а не значение по умолчанию: лимит каждого
      # запуска сервис передаёт сам, и без потолка выше 3 с запрос отклоняется.
      PISTON_RUN_TIMEOUT: 60000
      PISTON_RUN_CPU_TIME: 60000
      # То же для компиляции: сервис передаёт sandbox.compile_timeout_ms, а без потолка выше
      # 10 с Piston отклоняет запрос.
      PISTON_COMPILE_TIMEOUT: 60000
      PISTON_COMPILE_CPU_TIME: 60000
    ports: ["2000:2000"]
    volumes: [piston-packages:/piston/packages]
    tmpfs: [/tmp:exec]

  ollama:
    image: ollama/ollama
    profiles: [ollama]
    ports: ["11434:11434"]
    volumes: [ollama-data:/root/.ollama]
    # При малой видеопамяти Ollama берёт окно 4096 токенов, а запросу судьи нужно больше:
    # docs/taskgen/deployment.md, раздел про модели.
    environment: {OLLAMA_CONTEXT_LENGTH: "16384"}

  taskgen:
    build: .
    depends_on:
      taskgen-db-init: {condition: service_completed_successfully}
      piston: {condition: service_started}
    ports: ["8001:8000"]
    env_file: [{path: .env, required: false}]
    environment:
      TASKGEN_DATABASE_URL: postgresql+asyncpg://taskgen:taskgen@postgres:5432/taskgen
      TASKGEN_SANDBOX__PISTON_URL: http://piston:2000
      # Ключ облачного провайдера приходит из .env: docs/taskgen/deployment.md.
      TASKGEN_LLM__PROVIDERS__OLLAMA__BASE_URL: >-
        ${TASKGEN_LLM__PROVIDERS__OLLAMA__BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts: ["host.docker.internal:host-gateway"]

volumes:
  piston-packages:
  ollama-data:
