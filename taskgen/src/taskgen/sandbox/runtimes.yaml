# Окружения песочницы: имя runtime из шаблона задания -> пакет Piston и обвязка тестов.
# Новое окружение для уже поддержанного языка добавляется записью сюда, без правки кода.
# harness — язык обвязки тестов, список допустимых значений задан в registry.py.
python:
  language: python
  version: 3.12.0
  harness: python

# Собирается из taskgen/sandbox/packages/python-ml, официального пакета у Piston нет.
python-ml:
  language: python-ml
  version: 3.12.0
  harness: python

cpp:
  language: c++
  version: 10.2.0
  harness: cpp
  # Без лимита Piston не ограничивает память компилятора, а шаблонный код раздувает её легко.
  compile_memory_bytes: 1073741824
