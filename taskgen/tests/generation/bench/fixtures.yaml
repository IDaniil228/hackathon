# Настоящие генерации с разметкой, сделанной чтением, а не построением.
- id: real-qwen3.5-4b
  template: ml/junior/ml-validation-leakage-essay.md
  sample: ../samples/ml-validation-leakage-essay-qwen3.5-4b.json
  # Те же пропущенные факты, что в HONEST_BAD_VERDICTS из test_essay.py: случайное разбиение
