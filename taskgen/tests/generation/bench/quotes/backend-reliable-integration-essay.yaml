template: backend/senior/backend-reliable-integration-essay.md
honest:
  causes:
    - "Вызов партнёра идёт до коммита: если транзакция потом откатится, партнёр уже получил запись, которой у нас нет; если упасть после коммита без успешного вызова, запись теряется; повтор после таймаута, когда партнёр уже обработал запрос, даёт дубль."
    - "внешний HTTP-вызов не откатывается вместе с транзакцией"
    - "Таймаут не значит, что партнёр запрос не обработал."
  outbox:
    - "Пишу событие в таблицу outbox в той же транзакции, что и оформление, а отдельный процесс читает её или забирает изменения через Debezium, отправляет партнёру и помечает отправленным."
    - "transactional outbox"
    - "INSERT INTO outbox (event_id, payload) в той же транзакции"
  dual-write:
    - "Отправка в Kafka после коммита ненадёжна: если процесс упадёт между коммитом и отправкой, событие пропадёт, потому что запись в две системы не атомарна."
    - "проблема двойной записи"
    - "Между commit и producer.send процесс может умереть."
  delivery-guarantee:
    - "Схема даёт доставку хотя бы один раз, поэтому партнёру передаём event_id, и у него уникальный индекс по нему; порядок событий одной записи держим ключом партиции по её идентификатору."
    - "идемпотентный приёмник отбрасывает уже обработанные события"
    - "ключ сообщения Kafka — идентификатор оформления"
  retries:
    - "Повторы с экспоненциальной задержкой и случайным разбросом, таймаут на вызов, предел попыток и очередь недоставленных сообщений для ручного разбора; при массовых ошибках включается circuit breaker."
    - "DLQ после пяти неудачных попыток"
    - "задержка 1, 2, 4, 8 секунд плюс случайный разброс"
  monitoring-migration:
    - "Мониторю число и возраст неотправленных записей outbox, долю ошибок и задержку доставки, размер DLQ; переход делаю поэтапно: сначала пишу события параллельно со старым вызовом, потом переключаю отправку с возможностью отката."
    - "сверка расхождений с партнёром во время перехода"
    - "алерт, если самое старое неотправленное событие старше пяти минут"
claims:
  echo:
    - "Я объяснил, откуда берутся все три проблемы."
    - "Я предложил архитектуру согласованной передачи партнёру."
    - "Я описал гарантии доставки и обработку дублей."
    - "Я описал обработку долгих ответов и ошибок партнёра."
    - "Я перечислил метрики и план перехода."
  aware:
    causes: "Я объяснил причины потерь и дублей."
    outbox: "Я предложил transactional outbox."
    dual-write: "Я объяснил проблему двойной записи."
    delivery-guarantee: "Я назвал at-least-once и идемпотентный приёмник."
    retries: "Я описал повторы с backoff и DLQ."
    monitoring-migration: "Я описал мониторинг и миграцию."
