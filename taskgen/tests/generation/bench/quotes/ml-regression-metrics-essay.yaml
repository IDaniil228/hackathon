template: ml/junior/ml-regression-metrics-essay.md
honest:
  definitions:
    - "MAE — средний модуль ошибки, RMSE — корень из среднего квадрата ошибки, MAPE — средняя относительная ошибка в процентах; RMSE не меньше MAE и сильнее штрафует крупные промахи."
    - "ошибки 1, 1, 10 дают MAE 4 и RMSE около 5.8"
    - "MAPE = mean(|y - ŷ| / |y|) · 100 %"
  mape-zeros:
    - "MAPE делит ошибку на истинное значение: при нуле она не определена, а около нуля взлетает; к тому же перепрогноз она штрафует сильнее недопрогноза. Вместо неё возьму WAPE — сумму модулей ошибок, делённую на сумму факта."
    - "sMAPE или просто MAE вместо MAPE"
    - "Один час с потреблением 0.01 может дать ошибку в тысячи процентов."
  spikes-effect:
    - "Всплески сильнее всего бьют по RMSE, поэтому модель B, видимо, лучше ловит крупные значения; если бизнесу важны праздничные пики, выбор за ней."
    - "MAE и MAPE к редким выбросам почти равнодушны"
    - "Квадрат ошибки делает редкий большой промах главным слагаемым RMSE."
  asymmetric-cost:
    - "Раз недопрогноз дороже, использую квантильную функцию потерь с квантилем выше 0.5, например 0.8, и как метрику, и как loss при обучении."
    - "pinball loss с большим весом недопрогноза"
    - "LGBMRegressor(objective='quantile', alpha=0.8)"
  baseline:
    - "Сравню модель с простым прогнозом — значением неделю назад или средним за такие же прошлые часы; MASE как раз отношение ошибки модели к ошибке такого прогноза."
    - "наивный сезонный прогноз как базовая линия"
    - "Если модель не лучше значения прошлой недели, она не нужна."
claims:
  echo:
    - "Я объяснил, что измеряют MAE, RMSE и MAPE."
    - "Я объяснил поведение MAPE на этих данных и предложил замену."
    - "Я разобрал влияние всплесков на метрики и выбор модели."
    - "Я учёл, что недопрогноз дороже перепрогноза."
    - "Я предложил, с чем сравнить модель."
  aware:
    definitions: "Я дал определения MAE, RMSE и MAPE."
    mape-zeros: "Я объяснил проблему MAPE при нулях и предложил WAPE."
    spikes-effect: "Я разобрал влияние выбросов на RMSE."
    asymmetric-cost: "Я предложил квантильную функцию потерь."
    baseline: "Я сравнил модель с наивным прогнозом."
