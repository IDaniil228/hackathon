template: backend/middle/backend-concurrent-booking-essay.md
honest:
  race-explained:
    - "Две транзакции одновременно читают remaining = 1, обе проходят проверку, обе уменьшают до нуля и сохраняют; при READ COMMITTED чтение не блокируется, и вторая перезаписывает остаток, не видя первой брони."
    - "классическая гонка прочитать — проверить — записать"
    - "transaction.atomic не делает чтение и запись одной неделимой операцией."
  atomic-update:
    - "Offer.objects.filter(pk=offer_id, remaining__gt=0).update(remaining=F('remaining') - 1) и проверка, что обновилась одна строка."
    - "условное обновление в одном UPDATE"
    - "Если update вернул 0, мест нет и отвечаем 409."
  select-for-update:
    - "Можно взять строку с select_for_update(): вторая транзакция будет ждать первую, но под пиком все запросы встанут в очередь на одной строке."
    - "пессимистическая блокировка строки"
    - "Offer.objects.select_for_update().get(pk=offer_id)"
  compare-options:
    - "Ещё варианты — версия записи с повтором при конфликте, уровень SERIALIZABLE с повтором и CHECK (remaining >= 0); под пиком лучше атомарный UPDATE, он не держит блокировку долго."
    - "оптимистическая блокировка по полю version"
    - "При тысячах запросов повторы оптимистической схемы будут массовыми."
  process-lock:
    - "threading.Lock работает только внутри процесса, а запросы обрабатывают разные процессы на разных серверах, поэтому синхронизировать надо в базе."
    - "блокировка в Python не видна другим серверам"
    - "Нужна общая точка синхронизации — база или Redis."
  duplicate:
    - "Против двух броней от двойного нажатия нужно уникальное ограничение на пару пользователь и позиция и ключ идемпотентности запроса."
    - "UniqueConstraint(fields=['user', 'offer'])"
    - "Блокировка кнопки на клиенте не спасает от повторного запроса."
  concurrency-test:
    - "Тест на TransactionTestCase с настоящим PostgreSQL: десять потоков одновременно бронируют последнее место, и в базе должна оказаться одна бронь."
    - "TestCase не подходит, потому что всё идёт в одной транзакции"
    - "assert Booking.objects.filter(offer=offer).count() == 1"
claims:
  echo:
    - "Я объяснил, почему броней оказалось больше, чем мест."
    - "Я предложил два способа исправить обработчик и сравнил их."
    - "Я объяснил, почему не подходит блокировка в Python."
    - "Я описал защиту от двух броней одного пользователя."
    - "Я предложил автоматический тест."
  aware:
    race-explained: "Я объяснил состояние гонки."
    atomic-update: "Я предложил атомарный UPDATE."
    select-for-update: "Я предложил select_for_update."
    compare-options: "Я сравнил варианты синхронизации."
    process-lock: "Я объяснил, почему блокировка процесса не работает."
    duplicate: "Я предложил уникальное ограничение от двойных броней."
    concurrency-test: "Я написал тест на конкурентность."
