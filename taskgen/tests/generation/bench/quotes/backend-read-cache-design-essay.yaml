template: backend/middle/backend-read-cache-design-essay.md
honest:
  pattern:
    - "Возьму cache-aside: читаю из Redis, при промахе иду в базу и кладу результат в кэш; write-through проще держит кэш свежим, но пишет в кэш то, что никто не читает."
    - "база остаётся источником правды, кэш заполняется лениво"
    - "value = redis.get(key) or load_and_set(key)"
  invalidation:
    - "При изменении сначала коммит в базу, потом удаление ключа; если удалить до коммита, параллельное чтение положит в кэш старое значение, и только время жизни ограничит эту гонку."
    - "DEL ключа после записи, TTL как страховка"
    - "Событие об изменении записи сбрасывает её ключ в кэше."
  ttl-choice:
    - "Цену храню отдельным ключом с временем жизни меньше минуты, остальные поля — часами, и добавляю случайный разброс TTL, чтобы ключи не истекали одновременно."
    - "TTL по допустимому устареванию поля"
    - "ttl = 3600 + random.randint(0, 300)"
  stampede:
    - "Когда популярный ключ истекает в пик, сотни запросов одновременно идут в базу; защищаюсь блокировкой на ключ, чтобы пересчитывал один запрос, и отдаю остальным устаревшее значение."
    - "раннее обновление ключа до истечения"
    - "SET lock:key NX EX 5 перед походом в базу"
  local-vs-shared:
    - "Локальные кэши в шести репликах расходятся между собой, и сбросить их при изменении сложно; полезны только как короткий первый уровень для самых горячих записей."
    - "общий Redis вместо кэша в памяти каждой реплики"
    - "Локальный кэш на несколько секунд снимает нагрузку с Redis для горячего процента записей."
  metrics-fallback:
    - "Смотрю долю попаданий, задержку, вытеснения и память; если Redis недоступен, короткий таймаут и чтение из базы с ограничением нагрузки, а не 500."
    - "отказ кэша не должен ронять сервис"
    - "hit ratio ниже порога — алерт"
claims:
  echo:
    - "Я выбрал схему работы с кэшем и сравнил варианты."
    - "Я объяснил, как не показывать устаревшие данные и как выбрать время жизни."
    - "Я разобрал, что будет при пропаже популярной записи из кэша."
    - "Я сравнил локальный кэш и общий."
    - "Я назвал метрики кэша и поведение при его отказе."
  aware:
    pattern: "Я выбрал cache-aside."
    invalidation: "Я описал инвалидацию кэша."
    ttl-choice: "Я выбрал TTL с джиттером."
    stampede: "Я защитился от cache stampede."
    local-vs-shared: "Я сравнил локальный и общий кэш."
    metrics-fallback: "Я описал метрики и отказ кэша."
