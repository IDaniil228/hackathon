template: ml/middle/ml-imbalanced-threshold-essay.md
honest:
  accuracy-trap:
    - "Мошеннических операций доли процента, поэтому модель, которая всегда отвечает «не мошенник», получит accuracy 99.7 % и при этом не поймает ни одного случая."
    - "константный классификатор уже даёт 99.7 %"
    - "Accuracy здесь почти целиком определяется большим классом."
  roc-vs-pr:
    - "ROC AUC считает долю ложных срабатываний от огромного числа честных операций, поэтому даже тысячи ложных тревог почти не двигают кривую; лучше смотреть на PR-кривую и average precision."
    - "PR AUC, precision и recall при рабочем пороге"
    - "ROC AUC 0.93 тут мало что говорит о том, сколько ложных тревог увидят аналитики."
  cost-threshold:
    - "Порог выбираю так, чтобы минимизировать ожидаемую стоимость FN · c_fn + FP · c_fp, а не оставляю 0.5."
    - "перебираем порог и берём минимум суммарных потерь"
    - "Пропущенное мошенничество стоит в сто раз дороже ложной проверки, это и задаёт порог."
  threshold-data:
    - "Подбирать порог нужно на отдельной валидационной выборке, а тест оставить для финальной оценки."
    - "не на трейне и не на тесте"
    - "Порог, подобранный на тесте, даст завышенную оценку качества."
  calibration:
    - "Модель откалибрована, если среди операций с предсказанной вероятностью 0.2 мошеннических действительно около 20 %; проверяется диаграммой надёжности и Brier score."
    - "CalibratedClassifierCV, Platt или изотоническая"
    - "У бустинга вероятности обычно смещены, их исправляет изотоническая регрессия на отложенной выборке."
  calibration-need:
    - "Калибровка нужна, когда вероятность используется как число, например в формуле ожидаемых потерь; если мы только ранжируем операции, она не важна."
    - "для ранжирования не нужна"
    - "Ожидаемая стоимость считается из вероятности, поэтому без калибровки порог по стоимости будет неверным."
  imbalance-methods:
    - "Веса классов и пересэмплирование меняют обучение, а сдвиг порога — только решение; пересэмплирование к тому же искажает вероятности, и после него их надо заново калибровать."
    - "SMOTE только на обучающей части"
    - "Если сделать oversampling до разбиения, копии одних и тех же объектов попадут и в обучение, и в проверку."
claims:
  echo:
    - "Я объяснил, почему accuracy и ROC AUC здесь вводят в заблуждение и какие метрики лучше."
    - "Я описал, как выбрать порог классификации с учётом стоимостей ошибок и на каких данных его подбирать."
    - "Я объяснил, что такое калибровка вероятностей, когда она нужна и как её проверить."
    - "Я сравнил веса классов, пересэмплирование и сдвиг порога."
  aware:
    accuracy-trap: "Я объяснил ловушку accuracy при редком положительном классе."
    roc-vs-pr: "Я показал, почему ROC AUC хуже PR AUC при дисбалансе."
    cost-threshold: "Я выбрал порог по минимуму ожидаемой стоимости ошибок."
    threshold-data: "Я подбираю порог на правильной выборке."
    calibration: "Я дал определение калибровки и способы её проверки и исправления."
    calibration-need: "Я объяснил, когда калибровка нужна."
    imbalance-methods: "Я сравнил все способы борьбы с дисбалансом классов."
