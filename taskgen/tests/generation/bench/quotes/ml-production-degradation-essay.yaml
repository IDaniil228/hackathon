template: ml/senior/ml-production-degradation-essay.md
honest:
  training-serving-skew:
    - "Главная гипотеза — признаки в сервисе считаются не так, как в Spark при обучении: начну с того, что залогирую признаки инференса и посчитаю их офлайн для тех же запросов."
    - "сравнить поэлементно признаки из сервиса и из пайплайна обучения"
    - "Две независимые реализации одного признака почти всегда где-то расходятся."
  offline-leakage:
    - "Возможно, офлайн-метрика просто была завышена: в признаках могла протечь информация из будущего, а разбиение было случайным, а не по времени."
    - "модель выбирали по тестовой выборке"
    - "Проверю, не использовались ли при обучении данные, которых в момент предсказания ещё нет."
  drift-types:
    - "Сдвиг признаков — это изменение P(x), его видно по PSI или тесту Колмогорова — Смирнова; сдвиг концепции — изменение P(y|x), его видно только по метрике на свежей разметке."
    - "PSI по каждому признаку"
    - "При сдвиге меток меняется сама доля положительного класса."
  symptom-fit:
    - "Метрика упала резко сразу после выката, а дрифт так не выглядит: он развивается постепенно, значит скорее ошибка в коде или конфигурации."
    - "резкое падение → баг, плавное → дрифт"
    - "Время падения совпадает с релизом, это главная зацепка."
  feedback-loop:
    - "Модель сама влияет на то, какие данные мы потом видим: заблокированные ею операции не получают разметки, и следующая модель учится на смещённой выборке."
    - "петля обратной связи"
    - "Офлайн-метрика по логам старой модели смещена, потому что эти логи она же и сформировала."
  monitoring:
    - "Нужен мониторинг входов — распределения признаков, доля пропусков и задержка данных, выходов — распределение предсказаний, и качества по мере прихода меток, с алертами по порогам."
    - "алерт, если доля пропусков в признаке выросла вдвое"
    - "Распределение скоров модели меняется сразу, задолго до прихода разметки."
  rollout:
    - "Новую модель сначала запускаю в теневом режиме, потом канарейкой на 5 % трафика с заранее выбранной метрикой и критерием остановки, и держу быстрый откат."
    - "A/B-тест с заранее заданной метрикой"
    - "Если на канарейке метрика хуже порога, откатываемся на старую модель за минуты."
  single-feature-code:
    - "Чтобы это не повторилось, признаки должны считаться одним кодом для обучения и инференса, например через feature store, плюс тест на совпадение значений."
    - "одна библиотека признаков для Spark и сервиса"
    - "Тест в CI сравнивает признаки двух путей на фиксированном наборе запросов."
claims:
  echo:
    - "Я составил план расследования: какие гипотезы проверить, в каком порядке и какими данными."
    - "Я объяснил, чем отличаются сдвиг признаков, сдвиг концепции и расхождение обучения и инференса."
    - "Я описал мониторинг, который должен был поймать проблему раньше."
    - "Я рассказал, как выкатывать модели в будущем и как устранить причину проблемы."
  aware:
    training-serving-skew: "Я назвал расхождение обучения и инференса главной гипотезой и предложил проверку."
    offline-leakage: "Я рассмотрел версию с завышенной офлайн-оценкой."
    drift-types: "Я различил все виды сдвига и способы их обнаружения."
    symptom-fit: "Я учёл характер симптома в плане расследования."
    feedback-loop: "Я упомянул петлю обратной связи."
    monitoring: "Я предложил полный мониторинг входов, выходов и качества."
    rollout: "Я предложил безопасный выкат с канарейкой и откатом."
    single-feature-code: "Я предложил общий код признаков для обучения и инференса."
