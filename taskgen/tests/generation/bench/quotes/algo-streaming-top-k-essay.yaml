template: algo/senior/algo-streaming-top-k-essay.md
honest:
  memory-estimate:
    - "Различных значений порядка сотни миллионов, на ключ со счётчиком в словаре Python уходит под сотню байт, итого десятки гигабайт при лимите в несколько сотен мегабайт."
    - "10^8 × ~80 Б ≈ 8 ГБ, не влезает"
    - "Точный словарь не помещается: только накладные расходы на объекты съедят всю память."
  sketch-choice:
    - "Возьму Space-Saving: он хранит k счётчиков и сразу даёт кандидатов в частые элементы."
    - "Count-Min Sketch плюс куча кандидатов"
    - "Подойдёт алгоритм Misra — Gries: при переполнении все счётчики уменьшаются на единицу."
  error-bound:
    - "Count-Min только завышает частоту, и с вероятностью 1 − δ ошибка не больше εN при ширине e/ε и глубине ln(1/δ)."
    - "у Misra — Gries недооценка ≤ N/(k+1)"
    - "При k = 10 000 счётчиков ошибка не превысит одной десятитысячной от числа событий."
  topk-structure:
    - "Рядом со скетчем держу min-кучу на 100 элементов: при обновлении сравниваю оценку с минимумом кучи, это O(log k)."
    - "heap размера 100, вытесняем минимум"
    - "Текущие лидеры лежат в упорядоченной структуре, и обновление стоит логарифм от её размера."
  merge:
    - "Скетчи Count-Min с одинаковыми хэш-функциями складываются поэлементно, и гарантия сохраняется для суммарного N."
    - "Нельзя просто взять топ-100 каждого сервера: элемент, который везде на 101-м месте, в сумме может быть первым."
    - "сводки Misra — Gries сливаются, ошибка считается от общего потока"
  sliding-window:
    - "Для последнего часа держу 60 минутных скетчей и складываю их, а самый старый выбрасываю каждую минуту."
    - "кольцевой буфер минутных корзин"
    - "Можно вместо строгого окна использовать экспоненциальное затухание счётчиков, но тогда старые события влияют, просто меньше."
  exact-recount:
    - "Чтобы получить точные частоты, делаем второй проход по логам и считаем только найденных кандидатов: их всего несколько сотен, словарь маленький."
    - "второй проход только по кандидатам"
    - "Точный пересчёт дешёв, потому что ключей в нём порядка k, а не сотни миллионов."
  trade-offs:
    - "Мы платим точностью за память: частоты приблизительные, но для дашборда популярных запросов ошибка в доли процента допустима."
    - "свежесть против стоимости слияния"
    - "Пропустить элемент с пограничной частотой не страшно, а вот выдумать популярный запрос было бы хуже."
claims:
  echo:
    - "Я объяснил, почему точный подсчёт словарём не помещается в память, и оценил порядок памяти."
    - "Я предложил алгоритм приближённого поиска частых элементов и оценил память и ошибку подсчёта."
    - "Я описал, как объединить результаты серверов и сохраняются ли гарантии точности."
    - "Я рассказал, как учитывать только последний час и как получить точные частоты."
    - "Я перечислил компромиссы своего решения и допустимые ошибки."
  aware:
    memory-estimate: "Я оценил память точного словаря и показал, что лимит не выполняется."
    sketch-choice: "Я выбрал подходящий алгоритм Count-Min Sketch для частых элементов."
    error-bound: "Я привёл гарантию ошибки выбранного алгоритма."
    topk-structure: "Я описал кучу для поддержки ста лучших элементов."
    merge: "Я объяснил слияние скетчей со всех серверов с сохранением гарантий."
    sliding-window: "Я предложил способ учитывать окно в один час."
    exact-recount: "Я описал точный пересчёт частот для кандидатов."
    trade-offs: "Я явно назвал все компромиссы решения."
