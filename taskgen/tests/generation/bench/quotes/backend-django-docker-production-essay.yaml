template: backend/senior/backend-django-docker-production-essay.md
honest:
  expand-contract:
    - "Переименование столбца делаю в несколько релизов: добавляю новый столбец, код пишет в оба, переношу данные пачками, переключаю чтение, а старый удаляю только следующим релизом."
    - "expand → migrate → contract"
    - "Новая версия кода должна работать и со старой схемой, и с новой, тогда выкат без простоя."
  migration-run:
    - "migrate запускаю один раз отдельным Job перед переключением трафика, а не в entrypoint каждой реплики."
    - "init-контейнер с migrate"
    - "Добавление индекса делаю через CREATE INDEX CONCURRENTLY, чтобы не держать блокировку таблицы."
  secrets:
    - "SECRET_KEY и пароль базы приходят из переменных окружения, которые заполняет оркестратор из Vault, в образе и в git их нет."
    - "секреты в Kubernetes Secret, ротация раз в квартал"
    - "Пароль БД должен меняться без пересборки образа."
  django-security:
    - "В продакшене обязательно DEBUG = False, заполненный ALLOWED_HOSTS, SECURE_PROXY_SSL_HEADER за балансировщиком, SESSION_COOKIE_SECURE и CSRF_COOKIE_SECURE."
    - "manage.py check --deploy в CI"
    - "Включаю HSTS и прописываю CSRF_TRUSTED_ORIGINS для домена."
  non-root-image:
    - "Образ на python:3.12-slim с зафиксированными версиями зависимостей, процесс работает от пользователя app под gunicorn."
    - "USER app, gunicorn"
    - "Контейнер не должен запускаться от root."
  probes:
    - "Readiness проверяет, что есть соединение с базой, и при ошибке снимает реплику с балансировки, а liveness отвечает только о самом процессе и от внешних сервисов не зависит."
    - "по SIGTERM gunicorn дорабатывает текущие запросы, graceful timeout 30 с"
    - "Если liveness будет зависеть от базы, падение базы перезапустит все реплики разом."
  static-workers:
    - "Статику собираю collectstatic при сборке образа и отдаю через WhiteNoise или CDN, а медиа кладу в S3."
    - "воркеров 2 × ядра + 1, но с учётом лимита соединений к Postgres через PgBouncer"
    - "Пользовательские файлы не хранятся в контейнере, только в объектном хранилище."
  observability-rollback:
    - "После выката смотрю долю 5xx, p95 задержки и ошибки миграций, логи пишутся в JSON с request id."
    - "откат — вернуть предыдущий тег образа"
    - "Откат безопасен, потому что после шага «расширить» старая версия кода ещё работает с новой схемой."
claims:
  echo:
    - "Я описал, как выкатывать новую версию и миграции без простоя, и разобрал миграцию из ближайшего релиза."
    - "Я объяснил, как собрать образ приложения и чем запускать Django в контейнере."
    - "Я рассказал, как управлять секретами и какие настройки безопасности Django обязательны."
    - "Я описал проверки живости и готовности, корректную остановку, статику и число воркеров."
    - "Я перечислил, что логировать и мониторить после выката и как откатиться."
  aware:
    expand-contract: "Я разбил миграцию по схеме расширить — перенести — сузить."
    migration-run: "Я описал запуск миграций отдельной задачей до переключения трафика."
    secrets: "Я описал передачу секретов через менеджер секретов и их ротацию."
    django-security: "Я назвал все обязательные настройки безопасности Django."
    non-root-image: "Я сделал минимальный образ без root под gunicorn."
    probes: "Я различил проверки живости и готовности и обработал SIGTERM."
    static-workers: "Я описал раздачу статики и обосновал число воркеров."
    observability-rollback: "Я перечислил метрики после выката и описал безопасный откат."
