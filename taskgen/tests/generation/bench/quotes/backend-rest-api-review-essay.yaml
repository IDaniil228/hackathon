template: backend/junior/backend-rest-api-review-essay.md
honest:
  resource-urls:
    - "Адреса стоит строить вокруг ресурса: GET /items, POST /items, PATCH /items/{id}, DELETE /items/{id}, а действие задаёт метод, а не глагол в пути."
    - "getItems и deleteItem заменить на один ресурс /items и методы HTTP"
    - "DELETE /items/17 вместо GET /api/deleteItem?id=17"
  safe-get:
    - "Удаление через GET опасно: GET считается безопасным, его повторяют прокси, браузер при предзагрузке и поисковые роботы, и записи будут удаляться сами."
    - "GET не должен менять данные"
    - "Приложение при обрыве связи повторит GET deleteItem, а он не для этого."
  status-codes:
    - "updateItem для несуществующей записи должен отвечать 404, создание — 201, неверный id — 400 или 422, а не 500; тогда мониторинг по кодам увидит ошибки."
    - "200 с полем error прячет ошибку от дежурного и от клиента"
    - "POST /items → 201 Created, GET /items/abc → 400"
  error-format:
    - "Ошибки отдаём в едином JSON-формате с машинным кодом и сообщением, например по RFC 7807 application/problem+json."
    - "единое тело ошибки для всех эндпоинтов"
    - "{code: item_not_found, message: ...} в каждом ответе с ошибкой"
  authz:
    - "userId в параметре позволяет любому запросить чужие записи; пользователя надо брать из токена, а сервер должен проверять права на каждую запись."
    - "нельзя доверять идентификатору пользователя из запроса"
    - "GET /items отдаёт записи владельца токена, а не того, чей id в строке запроса."
  pagination:
    - "Тысячи записей нельзя отдавать одним ответом: нужен limit и курсор или offset."
    - "постраничная выдача списка"
    - "GET /items?limit=50&cursor=..."
  retries:
    - "PUT и DELETE идемпотентны, их можно повторять, а для создания нужен ключ идемпотентности в заголовке, чтобы повтор не создал дубль."
    - "Idempotency-Key для POST /items"
    - "Повтор POST без ключа создаст вторую запись."
  versioning:
    - "Нужна версия в пути, например /v1/, и обратно совместимые изменения: новые поля добавляем, старые не удаляем, пока живы старые версии приложения."
    - "старые клиенты продолжают ходить в /v1"
    - "Ломающие изменения — только в новой версии API."
claims:
  echo:
    - "Я нашёл проблемы этого API и объяснил последствия каждой."
    - "Я предложил исправленный вариант API и описал безопасный повтор запроса."
    - "Я описал, как менять API, не ломая старые версии приложения."
  aware:
    resource-urls: "Я перестроил адреса вокруг ресурсов."
    safe-get: "Я объяснил, почему GET не должен менять данные."
    status-codes: "Я исправил коды ответов."
    error-format: "Я предложил единый формат ошибок."
    authz: "Я нашёл доступ к чужим данным."
    pagination: "Я добавил пагинацию."
    retries: "Я сделал повторы безопасными через идемпотентность."
    versioning: "Я предложил версионирование API."
