template: algo/junior/algo-binary-search-bounds-essay.md
honest:
  sorted-precondition:
    - "Двоичный поиск работает, потому что записи упорядочены по времени; он делает O(log n) шагов, для 10 миллионов записей это около 24 сравнений вместо миллионов при переборе."
    - "без сортировки по ключу двоичный поиск неприменим"
    - "log2(10^7) ≈ 24"
  infinite-loop:
    - "Если lo и hi соседние, а records[lo].time < moment, то mid = lo, и присваивание lo = mid ничего не меняет — цикл крутится вечно, например на времени [1, 2] и моменте 5."
    - "lo = mid при mid == lo не сдвигает границу"
    - "При двух записях и моменте позже обеих функция не выходит из while."
  not-found:
    - "При hi = len(records) - 1 функция не умеет сказать, что подходящей записи нет: для момента позже последней записи она вернёт последний индекс, а на пустом списке — 0."
    - "надо брать hi = len(records) и возвращать len(records) как признак отсутствия"
    - "Ответ len(records) значит, что все записи раньше момента."
  fixed-code:
    - "lo, hi = 0, len(records); while lo < hi: mid = (lo + hi) // 2; если records[mid].time < moment, то lo = mid + 1, иначе hi = mid; return lo."
    - "при равном времени граница уходит влево, поэтому вернётся первая из одинаковых записей"
    - "if records[mid].time < moment: lo = mid + 1 else: hi = mid"
  bounds-check:
    - "Все записи левее lo раньше момента, а все начиная с hi не раньше; интервал на каждом шаге сужается хотя бы на один элемент."
    - "проверю пустой список, одну запись, все раньше, все позже и серию с одинаковым временем"
    - "Правильность держится на том, что ответ всегда лежит в полуинтервале [lo, hi]."
  bisect:
    - "В стандартной библиотеке есть bisect.bisect_left, с Python 3.10 у него есть параметр key; bisect_right отличается тем, что возвращает позицию после всех равных элементов."
    - "bisect_left даёт левую границу среди равных, bisect_right — правую"
    - "bisect.bisect_left(records, moment, key=lambda r: r.time)"
claims:
  echo:
    - "Я объяснил, почему здесь применим двоичный поиск, и сравнил его сложность с перебором."
    - "Я нашёл ошибки в функции и привёл входы, на которых она ломается."
    - "Я исправил функцию и описал, как проверить границы."
    - "Я назвал функцию стандартной библиотеки и её два варианта."
  aware:
    sorted-precondition: "Я указал условие применимости и логарифмическую сложность."
    infinite-loop: "Я нашёл зацикливание и привёл пример."
    not-found: "Я нашёл, что функция не сообщает об отсутствии записи."
    fixed-code: "Я привёл правильно исправленную функцию."
    bounds-check: "Я обосновал выбор границ и краевые случаи."
    bisect: "Я назвал bisect_left и отличие от bisect_right."
