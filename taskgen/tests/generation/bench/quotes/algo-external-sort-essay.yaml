template: algo/senior/algo-external-sort-essay.md
honest:
  run-generation:
    - "Читаю данные кусками по 10–12 ГБ, сортирую каждый в памяти и пишу на диск отсортированной серией; получится около 170–200 серий."
    - "первый проход формирует отсортированные серии размером с память"
    - "2 ТБ / 12 ГБ ≈ 170 серий"
  k-way-merge:
    - "Серии сливаю многопутевым слиянием через кучу из k головных элементов, это O(N log k); на каждую серию нужен буфер чтения, поэтому число серий в одном слиянии ограничено памятью."
    - "200 серий по 50 МБ буфера — 10 ГБ, всё сливается за один проход"
    - "heapq.merge по открытым файлам серий"
  passes-estimate:
    - "Проходов два, на каждом чтение и запись 2 ТБ, то есть 8 ТБ ввода-вывода; при 2 ГБ/с это около 70 минут, в 4 часа одна машина укладывается с запасом."
    - "оценка времени по пропускной способности SSD"
    - "Формирование серий и одно слияние — по разу прочитать и записать весь объём."
  distributed:
    - "Границы диапазонов ключей выбираю по случайной выборке, каждая машина отправляет записи владельцу диапазона и сортирует свой диапазон локально; результат — упорядоченные куски по машинам."
    - "распределённая сортировка по диапазонам, как в TeraSort"
    - "Машина i получает ключи между i-й и (i+1)-й границей."
  skew:
    - "Треть записей у нескольких ключей, поэтому границы беру по квантилям выборки, а тяжёлые ключи дроблю между машинами по дополнительному полю."
    - "горячие ключи обрабатываю отдельно, иначе одна машина получит треть данных"
    - "Тяжёлый ключ можно разрезать по второму полю и раздать нескольким машинам подряд."
  reliability:
    - "Задачи по диапазонам перезапускаются по отдельности, промежуточные серии лежат на диске, а время этапов контролирует алерт; падение машины не перезапускает всю ночную задачу."
    - "перезапускаю только диапазон упавшей машины"
    - "Алерт, если этап идёт дольше плана, чтобы успеть до утра."
  alternatives:
    - "Если нужна только группировка по ключу, хватит хэш-разбиения без общего порядка; ещё можно сократить записи до ключа и смещения или взять Spark или sort с ограничением памяти."
    - "группировка дешевле полной сортировки"
    - "sort -S 12G --parallel=8 на одной машине"
claims:
  echo:
    - "Я описал этапы сортировки на одной машине и оценил время."
    - "Я объяснил устройство слияния и его ограничения."
    - "Я распределил сортировку по кластеру с учётом неравномерных ключей."
    - "Я описал, как уложиться в срок и пережить падение машины."
    - "Я предложил альтернативы полной сортировке."
  aware:
    run-generation: "Я описал формирование серий внешней сортировки."
    k-way-merge: "Я описал k-путевое слияние кучей."
    passes-estimate: "Я оценил число проходов и время."
    distributed: "Я предложил распределённую сортировку по диапазонам ключей."
    skew: "Я учёл перекос ключей через квантили."
    reliability: "Я обеспечил надёжность и срок."
    alternatives: "Я назвал альтернативы полной сортировке."
