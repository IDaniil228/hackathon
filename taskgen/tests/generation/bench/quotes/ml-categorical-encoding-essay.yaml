template: ml/junior/ml-categorical-encoding-essay.md
honest:
  ordinal-problem:
    - "Номера по алфавиту придумывают порядок и расстояния, которых нет: линейная модель решит, что город 3 втрое больше города 1, и даст один коэффициент на шаг номера; деревья же просто делят признак порогами, им это не мешает."
    - "для случайного леса такие номера допустимы"
    - "Алфавитный номер не несёт смысла, а линейная модель читает его как величину."
  one-hot:
    - "Признак с несколькими значениями кодирую one-hot: OneHotEncoder или pd.get_dummies, каждый город — свой столбец из нулей и единиц; для линейной модели без регуляризации один столбец убираю."
    - "city_Москва, city_Казань со значениями 0 и 1"
    - "OneHotEncoder(drop='first')"
  high-cardinality:
    - "Для 20 тысяч значений объединю редкие в категорию прочие и закодирую частотой или target encoding со сглаживанием по фолдам; у target encoding риск утечки целевой переменной."
    - "можно хэшировать признак или учить эмбеддинги"
    - "Значения реже 50 раз сливаю в одну категорию."
  unknown-categories:
    - "Кодировщик знает только значения из обучения, поэтому новое значение роняет сервис; нужен OneHotEncoder(handle_unknown='ignore') или категория прочие, и кодировщик сохраняется вместе с моделью."
    - "кодировщик обучается на train и едет в прод вместе с моделью"
    - "Новая категория должна превращаться в нулевой вектор, а не в ошибку."
  scaling:
    - "Линейной модели масштабирование нужно, потому что регуляризация штрафует коэффициенты одинаково, а случайному лесу нет; параметры StandardScaler считаю только на обучении внутри Pipeline с ColumnTransformer."
    - "деревьям масштаб признаков безразличен"
    - "Pipeline([('prep', ColumnTransformer(...)), ('model', Ridge())])"
claims:
  echo:
    - "Я объяснил, что не так с номерами по алфавиту и для какой модели это допустимо."
    - "Я показал, как закодировать признак с небольшим числом значений."
    - "Я предложил способы для признака с 20 тысячами значений."
    - "Я объяснил падение сервиса на новых категориях."
    - "Я разобрал масштабирование для линейной модели и леса."
  aware:
    ordinal-problem: "Я объяснил проблему ложного порядка."
    one-hot: "Я предложил one-hot кодирование."
    high-cardinality: "Я разобрал признак высокой кардинальности."
    unknown-categories: "Я обработал неизвестные категории."
    scaling: "Я разобрал масштабирование признаков."
