template: ml/middle/ml-training-instability-essay.md
honest:
  diagnostics-plan:
    - "Сначала проверю данные на NaN и бесконечности, потом попробую переобучиться на одном маленьком батче, буду логировать норму градиентов и активации по шагам и включу torch.autograd.set_detect_anomaly."
    - "один батч 200 шагов должен выучиться почти до нуля"
    - "assert torch.isfinite(x).all() на входах"
  log-softmax:
    - "torch.log(torch.softmax(...)) неустойчив: вероятность округляется до нуля, логарифм даёт минус бесконечность, а потом NaN; надо считать F.log_softmax или сразу nn.CrossEntropyLoss на логитах."
    - "CrossEntropyLoss принимает логиты и считает логарифм устойчиво"
    - "loss = nn.CrossEntropyLoss()(logits, targets)"
  input-scale:
    - "Входы в десятки тысяч дают огромные активации и градиенты, поэтому признаки надо стандартизовать по статистике обучающей части."
    - "нормализация входов до нулевого среднего и единичной дисперсии"
    - "x = (x - mean_train) / std_train"
  learning-rate:
    - "Скорость 0.1 для Adam слишком большая, обычно берут 1e-3 или 3e-4; после деления на 100 шаги стали слишком малы. Подберу перебором по логарифмической сетке или LR range test и добавлю разогрев и расписание."
    - "cosine schedule с warmup"
    - "lr из сетки 1e-4, 3e-4, 1e-3, 3e-3"
  batch-size:
    - "Батч из 8 даёт шумный градиент; если больший не влезает в память, накапливаю градиенты за несколько батчей и включаю смешанную точность, а скорость обучения масштабирую вместе с батчем."
    - "gradient accumulation"
    - "optimizer.step() раз в 8 батчей, loss делится на 8"
  stabilizers:
    - "Помогают clip_grad_norm_, BatchNorm или LayerNorm, правильная инициализация и смешанная точность с масштабированием потерь; цена — лишние вычисления и ещё гиперпараметры."
    - "ограничение нормы градиента"
    - "torch.nn.utils.clip_grad_norm_(model.parameters(), 1.0)"
claims:
  echo:
    - "Я составил план диагностики NaN."
    - "Я нашёл причины NaN в описании и исправил каждую."
    - "Я объяснил, почему потери не снижаются, и как подобрать скорость обучения."
    - "Я разобрал влияние размера батча."
    - "Я перечислил приёмы стабилизации и их издержки."
  aware:
    diagnostics-plan: "Я составил план диагностики."
    log-softmax: "Я нашёл неустойчивый log softmax."
    input-scale: "Я нормализовал входы."
    learning-rate: "Я подобрал скорость обучения."
    batch-size: "Я разобрал размер батча и накопление градиентов."
    stabilizers: "Я назвал приёмы стабилизации."
