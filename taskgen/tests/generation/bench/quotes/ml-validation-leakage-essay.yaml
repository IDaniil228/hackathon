template: ml/junior/ml-validation-leakage-essay.md
honest:
  overfitting:
    - "Модель просто запомнила обучающие примеры вместе с шумом, а общей закономерности не нашла, поэтому на новых данных качество падает."
    - "0.99 на трейне и сильно меньше на отложенной выборке — классический признак переобучения."
    - "Заметить это можно до запуска: сравнить метрику на обучении и на валидации, большой разрыв и есть сигнал."
  preprocessing-leak:
    - "Средние для заполнения пропусков посчитаны по всей таблице, то есть в них уже есть информация из проверочной части."
    - "fit для StandardScaler и SimpleImputer делаем только на train, а к valid и test применяем transform."
    - "Проще всего завернуть импьютер, скейлер и модель в один Pipeline, тогда при каждом разбиении статистики считаются заново по обучающей части."
  tuning-leak:
    - "Гиперпараметры подбирались по той же части, на которой потом посчитано итоговое качество, поэтому эта цифра завышена: мы выбрали настройки, которые случайно хорошо легли именно на эту выборку."
    - "Если много раз смотреть на одну и ту же проверочную часть, она перестаёт быть независимой оценкой."
    - "отчитываться нужно на данных, которые при подборе не трогали"
  split-scheme:
    - "Нужны три части: train для обучения, validation для подбора настроек и test, на который смотрим один раз в самом конце."
    - "Можно сделать кросс-валидацию на обучающей части для подбора параметров и отдельно держать тест."
    - "test откладываем сразу и не трогаем до финальной оценки"
  time-split:
    - "Раз у записей есть даты, случайное разбиение пускает будущие данные в обучение, а модель потом проверяется на прошлом."
    - "Надо обучать на первых месяцах и проверять на последних, как это и будет в реальной работе."
    - "TimeSeriesSplit или просто отсечка по дате"
  remedies:
    - "У бустинга стоит ограничить глубину деревьев и их число и включить раннюю остановку по валидационной выборке."
    - "Помогут регуляризация (L1, L2, min_child_samples) и больше обучающих данных."
    - "early_stopping_rounds=50, max_depth=4"
claims:
  echo:
    - "Я объяснил, почему качество на новых данных оказалось ниже, чем на обучающей выборке, и как это заметить по метрикам."
    - "Я нашёл в работе аналитика все шаги, из-за которых оценка качества оказалась завышенной, и объяснил механизм каждого."
    - "Я предложил правильную схему проверки модели и рассказал, как подбирать гиперпараметры."
    - "Я описал, когда случайное разбиение не подходит и чем его заменить."
    - "Я перечислил, что изменить в модели, чтобы разрыв между обучающими и новыми данными уменьшился."
  aware:
    overfitting: "Я подробно объяснил, что такое переобучение и как его заметить по разрыву метрик."
    preprocessing-leak: "Я подробно объяснил, почему масштабирование и заполнение пропусков до разбиения дают утечку."
    tuning-leak: "Я разобрал утечку через подбор гиперпараметров на отчётной выборке."
    split-scheme: "Я предложил схему train, validation и test и объяснил назначение каждой части."
    time-split: "Я объяснил, почему здесь нужно разбиение по времени."
    remedies: "Я перечислил все способы снизить переобучение бустинга."
