template: ml/senior/ml-ab-test-design-essay.md
honest:
  offline-gap:
    - "Офлайн-метрика посчитана по логам старой модели: мы знаем реакцию только на то, что она показывала, поэтому оценка новой модели смещена, да и метрика ранжирования не равна выручке."
    - "офлайн-метрика по чужим логам смещена"
    - "NDCG по логам не учитывает, как пользователи отреагируют на новую выдачу."
  unit:
    - "Делить надо по пользователю, а не по запросу: иначе один человек видит обе модели, эффекты смешиваются, а наблюдения зависимы и ошибка занижена."
    - "рандомизация по user_id"
    - "group = hash(user_id + salt) % 2"
  metrics-power:
    - "Основную метрику фиксирую заранее, добавляю защитные — задержку, жалобы, удержание; размер выборки считаю по минимальному эффекту, дисперсии, альфе и мощности, а длительность беру целыми неделями."
    - "расчёт размера выборки до старта"
    - "n ≈ 16 σ² / δ² на группу при альфе 0.05 и мощности 0.8"
  peeking:
    - "Если каждый день смотреть и останавливаться при первом p < 0.05, доля ложных побед сильно растёт; нужен фиксированный горизонт или последовательный тест с границами O'Brien — Fleming."
    - "alpha spending для ранней остановки"
    - "Семь ежедневных проверок дают ложный успех заметно чаще 5 %."
  variance:
    - "Скошенная выручка даёт огромную дисперсию, поэтому применю CUPED с выручкой за месяц до эксперимента, винзоризацию выбросов, стратификацию и бутстреп для интервалов."
    - "CUPED снижает дисперсию в разы"
    - "Y_cuped = Y - θ (X - mean(X))"
  srm:
    - "Разница групп в 3 % при таком трафике — это SRM, проверяю хи-квадратом; пока не найдена причина в назначении групп или логировании, результатам верить нельзя."
    - "рассогласование размеров групп"
    - "При миллионе пользователей 3 % — это десятки тысяч, случайностью не объяснить."
  distortions:
    - "Результат недельного теста искажают эффект новизны и привыкания, день недели и сезонность, влияние групп друг на друга и множественные сравнения по многим метрикам."
    - "эффект новизны в первые дни"
    - "Поправка Бонферрони или Холма на много метрик."
claims:
  echo:
    - "Я объяснил, почему офлайн-выигрыш не гарантирует успеха."
    - "Я спроектировал эксперимент и нашёл ошибки плана."
    - "Я объяснил опасность ежедневных проверок."
    - "Я разобрал влияние скошенной выручки."
    - "Я оценил размеры групп в первый день."
    - "Я перечислил эффекты, искажающие результат."
  aware:
    offline-gap: "Я объяснил разрыв офлайн и онлайн метрик."
    unit: "Я выбрал рандомизацию по пользователю."
    metrics-power: "Я рассчитал мощность и выбрал метрики."
    peeking: "Я объяснил проблему подглядывания."
    variance: "Я применил CUPED."
    srm: "Я нашёл SRM."
    distortions: "Я назвал искажающие эффекты."
