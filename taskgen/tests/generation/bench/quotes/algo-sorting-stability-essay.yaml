template: algo/junior/algo-sorting-stability-essay.md
honest:
  stable-definition:
    - "Сортировка устойчива, если записи с одинаковым ключом после неё идут в том же порядке, в каком были на входе."
    - "равные элементы не переставляются между собой"
    - "Устойчивость означает, что при совпадении поля сортировки исходный порядок сохраняется."
  two-keys-order:
    - "Сначала сортируем по стажу, затем устойчиво по отделу — получится группировка по отделам с порядком по стажу внутри."
    - "sorted(rows, key=lambda r: (r.dept, r.years))"
    - "Можно и одной сортировкой с составным ключом (отдел, стаж)."
  why-stable:
    - "Вторая сортировка обязана быть устойчивой, иначе внутри одного отдела она перемешает строки и порядок по стажу, полученный первым проходом, пропадёт."
    - "неустойчивый второй проход разрушит результат первого"
    - "Если второй проход переставит равные по отделу записи, вся работа первой сортировки потеряется."
  lower-bound:
    - "Любая сортировка сравнениями делает в худшем случае не меньше log2(n!) сравнений, а это порядка n log n."
    - "У дерева решений должно быть n! листьев, значит его высота Ω(n log n)."
    - "нижняя граница Ω(n log n) только для сортировок, которые сравнивают элементы"
  counting-sort:
    - "Отделов всего двадцать три, поэтому можно посчитать, сколько строк в каждом отделе, и разложить строки по корзинам за O(n + k) без сравнений."
    - "counting sort по номеру отдела, k = 23"
    - "Когда ключи из маленького диапазона, работает сортировка подсчётом или поразрядная, и она быстрее n log n."
  builtin:
    - "В Python sorted и list.sort используют Timsort: он устойчивый, в худшем случае O(n log n), а на почти упорядоченных данных близок к линейному, потому что находит готовые упорядоченные серии и сливает их."
    - "Timsort устойчив"
    - "Начиная с 3.11 правило слияния серий заменили на Powersort, но устойчивость осталась."
claims:
  echo:
    - "Я объяснил, что такое устойчивая сортировка и почему она важна в этой ситуации."
    - "Я описал, как получить нужный порядок по двум полям и в каком порядке делать сортировки."
    - "Я назвал нижнюю оценку числа сравнений и свойство ключей, при котором можно быстрее."
    - "Я рассказал, какой алгоритм использует встроенная сортировка Python и как она ведёт себя на почти упорядоченных данных."
  aware:
    stable-definition: "Я дал точное определение устойчивой сортировки."
    two-keys-order: "Я правильно описал порядок двух сортировок по полям."
    why-stable: "Я объяснил, почему вторая сортировка должна быть устойчивой."
    lower-bound: "Я доказал нижнюю оценку n log n через дерево решений."
    counting-sort: "Я предложил сортировку подсчётом и оценил её сложность."
    builtin: "Я верно описал Timsort во встроенной сортировке Python."
