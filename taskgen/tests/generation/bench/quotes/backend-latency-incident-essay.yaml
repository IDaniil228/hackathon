template: backend/senior/backend-latency-incident-essay.md
honest:
  symptom-fit:
    - "Задержка выросла у всех сразу после выкатки, поэтому первая гипотеза — изменение в новой версии сервиса: сравню версии, конфигурацию и при необходимости откачу."
    - "если растёт только в пик у части запросов, ищу насыщение: пул соединений с базой, блокировки, очереди потоков"
    - "Совпадение по времени с релизом — главная зацепка, откат проверяет её быстрее всего."
  metrics:
    - "Для каждого сервиса метрики RED — частота запросов, ошибки и длительность, а для ресурсов USE — утилизация, насыщение и ошибки пула соединений, очередей, процессора и базы."
    - "гистограмма длительности запросов на каждом сервисе"
    - "http_request_duration_seconds с метками сервиса и маршрута"
  tracing:
    - "Нужна распределённая трассировка через OpenTelemetry с передачей контекста через шлюз и три сервиса, чтобы видеть, на каком участке теряется время."
    - "trace id проходит через всю цепочку"
    - "По трассе видно, что 4 из 5 секунд запрос ждал второй сервис."
  logs:
    - "Журналы в JSON с идентификатором запроса и трассировки, собранные в одном месте, а не текстом на каждом сервере."
    - "структурированные логи с request_id"
    - "Логи всех серверов собираются в одно хранилище с поиском."
  percentiles:
    - "Среднее прячет хвост: если у 1 % запросов 5 секунд, среднее почти не сдвинется, а p99 покажет; перцентили считаю по гистограммам, а не усредняю между серверами."
    - "смотрим p95 и p99"
    - "histogram_quantile(0.99, ...)"
  slo-alerts:
    - "SLO: 99 % запросов быстрее 300 мс за 28 дней; алерт срабатывает по скорости расхода бюджета ошибок, а не по загрузке процессора."
    - "оповещения по симптомам для пользователя"
    - "burn rate алерт на окнах в 1 час и 6 часов"
  postmortem:
    - "После инцидента — разбор без поиска виноватых: хронология, причина, почему мониторинг молчал, задачи с ответственными и сроками."
    - "blameless postmortem"
    - "Отдельно разбираем, почему узнали от поддержки, а не от алерта."
claims:
  echo:
    - "Я описал, как расследовать инцидент и с каких гипотез начать."
    - "Я перечислил метрики, журналы и трассировки, которые нужно добавить."
    - "Я объяснил, почему средняя задержка плохой показатель."
    - "Я сформулировал цели надёжности и оповещения."
    - "Я описал, что делать после инцидента."
  aware:
    symptom-fit: "Я подобрал гипотезы под симптом."
    metrics: "Я предложил метрики RED и USE."
    tracing: "Я предложил распределённую трассировку."
    logs: "Я структурировал журналы."
    percentiles: "Я заменил среднее перцентилями."
    slo-alerts: "Я сформулировал SLO и алерты."
    postmortem: "Я описал постмортем."
