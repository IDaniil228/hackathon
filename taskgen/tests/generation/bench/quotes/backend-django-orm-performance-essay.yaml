template: backend/middle/backend-django-orm-performance-essay.md
honest:
  diagnose:
    - "Первым делом включу django-debug-toolbar и посмотрю, сколько SQL-запросов уходит на одну страницу и какие из них самые долгие."
    - "connection.queries + EXPLAIN ANALYZE на медленный запрос"
    - "На проде поможет APM вроде Sentry Performance, он покажет, что время уходит в базу."
  n-plus-one:
    - "Классическая проблема N+1: на каждый заказ из списка отдельно идёт запрос за покупателем и ещё один за позициями."
    - "50 заказов на странице дают 151 запрос"
    - "Сериализатор в цикле дёргает связанные объекты, и каждый раз это новый запрос к базе."
  select-related:
    - "Для customer это ForeignKey, поэтому select_related(\"customer\") подтянет его тем же запросом через JOIN."
    - "Order.objects.select_related(\"customer\")"
    - "select_related работает для связей «один к одному» и внешних ключей."
  prefetch-related:
    - "Для позиций заказа, это обратная связь, нужен prefetch_related: Django сделает один отдельный запрос и разложит результаты по заказам в Python."
    - "prefetch_related(Prefetch(\"items\", queryset=Item.objects.filter(active=True)))"
    - "Для many-to-many JOIN не подходит, нужен второй запрос."
  annotate-count:
    - "Вместо .count() в сериализаторе считаем число позиций в самом запросе: .annotate(items_count=Count(\"items\"))."
    - "Count в annotate, а не count() на каждой строке"
    - "Тогда количество приходит одной колонкой вместе с заказом."
  indexes:
    - "Фильтр идёт по status, а сортировка по created_at, поэтому добавлю составной индекс models.Index(fields=[\"status\", \"-created_at\"]) миграцией и сравню EXPLAIN до и после."
    - "индекс (status, created_at desc)"
    - "Без индекса база каждый раз читает всю таблицу заказов и сортирует её."
  regression-guard:
    - "Напишу тест с assertNumQueries(3), чтобы любой новый N+1 сразу ронял CI."
    - "django_assert_num_queries в pytest"
    - "Замерю время ответа эндпоинта до и после правки."
  extras:
    - "Тяжёлое поле description можно не грузить через only() или defer()."
    - "На больших таблицах OFFSET медленный, лучше курсорная пагинация."
    - "кэш на минуту с инвалидацией при изменении заказа"
claims:
  echo:
    - "Я описал, как буду искать причину медленной работы и какими инструментами."
    - "Я нашёл проблемы в приведённом коде и показал исправленный код."
    - "Я перечислил, что нужно сделать на стороне базы данных."
    - "Я объяснил, как проверить, что исправление помогло, и не допустить регресса."
  aware:
    diagnose: "Я назвал все инструменты для поиска медленных запросов."
    n-plus-one: "Я нашёл проблему N+1 в коде."
    select-related: "Я применил select_related для внешнего ключа."
    prefetch-related: "Я применил prefetch_related для обратной связи и объяснил разницу."
    annotate-count: "Я перенёс подсчёт в annotate с Count."
    indexes: "Я предложил правильный составной индекс."
    regression-guard: "Я добавил тест на число запросов против регресса."
    extras: "Я упомянул дополнительные меры оптимизации с оговорками."
