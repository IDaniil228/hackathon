template: backend/junior/backend-login-security-review-essay.md
honest:
  sql-injection:
    - "Логин подставляется в SQL f-строкой, поэтому ввод admin' -- обрежет условие, а ' OR '1'='1 вернёт первую строку; нужен параметризованный запрос с плейсхолдером ?."
    - "db.execute('SELECT password_hash FROM users WHERE username = ?', (username,))"
    - "Данные пользователя никогда не склеиваются с текстом запроса."
  weak-hash:
    - "MD5 без соли считается миллиардами в секунду, и при утечке копии базы пароли вскроют перебором или готовыми таблицами; надо хранить bcrypt, scrypt или Argon2 с солью."
    - "медленная функция хэширования паролей с солью вместо md5"
    - "bcrypt.hashpw(password.encode(), bcrypt.gensalt())"
  password-in-logs:
    - "Пароль пишется в журнал при неудачном входе, и его прочитает любой сотрудник поддержки; пароль нельзя логировать вообще."
    - "убрать password из сообщения лога"
    - "log.info('login failed: user=%s', username)"
  constant-time:
    - "Хэши сравниваются обычным ==, которое выдаёт разницу по времени; лучше проверка из библиотеки паролей или hmac.compare_digest."
    - "сравнение за постоянное время"
    - "Время сравнения строк зависит от длины общего префикса."
  fixed-function:
    - "В исправленной функции запрос параметризован, проверка идёт через bcrypt.checkpw, а в журнал пишется только факт неудачи без пароля."
    - "исправленный код без f-строки в SQL и без пароля в логе"
    - "return bcrypt.checkpw(password.encode(), row[0])"
  outer-measures:
    - "Против тысяч попыток в час нужно ограничение числа попыток по адресу и учётной записи, задержки или капча, а ещё HTTPS и двухфакторная аутентификация."
    - "rate limiting на форму входа и оповещение о подозрительных входах"
    - "После пяти неудачных попыток — пауза и капча."
claims:
  echo:
    - "Я нашёл уязвимости функции и описал, как ими воспользуется злоумышленник."
    - "Я прислал исправленную функцию и объяснил изменения."
    - "Я перечислил меры защиты входа вне функции."
  aware:
    sql-injection: "Я нашёл SQL-инъекцию и исправил её."
    weak-hash: "Я заменил MD5 на медленный хэш с солью."
    password-in-logs: "Я убрал пароль из журнала."
    constant-time: "Я исправил сравнение хэшей."
    fixed-function: "Я привёл полностью исправленную функцию."
    outer-measures: "Я предложил меры против перебора паролей."
