template: algo/middle/algo-dependency-order-essay.md
honest:
  graph-model:
    - "Элементы — вершины ориентированного графа, ребро идёт от зависимости к зависящему элементу; храню списки смежности."
    - "нужен порядок, в котором каждое ребро ведёт вперёд"
    - "graph[dep].append(item) для каждой связи"
  topo-algorithm:
    - "Алгоритм Кана: считаю для каждой вершины число невыполненных зависимостей, кладу в очередь вершины с нулём и при извлечении уменьшаю счётчики соседей; это O(V + E)."
    - "можно и обходом в глубину: добавлять вершину после всех потомков и развернуть список"
    - "Топологическая сортировка за линейное время от числа вершин и рёбер."
  cycle-detect:
    - "Если после работы Кана остались вершины с ненулевым счётчиком, в графе есть цикл."
    - "в DFS цикл — это ребро в вершину, которая ещё лежит в стеке обхода"
    - "if processed < len(nodes): есть цикл"
  cycle-report:
    - "Чтобы показать цикл, храню предка каждой вершины при обходе и, встретив ребро в серую вершину, иду по предкам до неё и печатаю цепочку элементов."
    - "можно найти компоненты сильной связности и показать их пользователю"
    - "Пользователь должен увидеть список элементов цикла, а не просто ошибку."
  levels:
    - "Параллельно можно запускать все вершины, у которых не осталось невыполненных зависимостей: беру весь текущий слой очереди целиком, а после его завершения формирую следующий."
    - "послойный Кан даёт группы для одновременного запуска"
    - "Каждый слой — элементы, все зависимости которых уже в предыдущих слоях."
  critical-path:
    - "При неограниченных исполнителях время равно длине самого длинного пути по длительностям: finish[v] = duration[v] + max(finish[u]) по зависимостям, считаю в найденном порядке за O(V + E)."
    - "это критический путь ациклического графа"
    - "Самый длинный путь в DAG считается динамикой по топологическому порядку."
  limited-workers:
    - "С 8 исполнителями оптимальное расписание в общем случае NP-трудно, поэтому беру эвристику: запускаю готовые элементы с наибольшим оставшимся путём до конца."
    - "оценка снизу — максимум из критического пути и суммы длительностей, делённой на 8"
    - "list scheduling с приоритетом по длине оставшегося пути"
claims:
  echo:
    - "Я описал, как представить данные и в каком порядке обрабатывать элементы."
    - "Я объяснил, как обнаружить круговую зависимость и показать её пользователю."
    - "Я описал, какие элементы можно запускать одновременно."
    - "Я посчитал наименьшее время работы и разобрал случай с 8 исполнителями."
  aware:
    graph-model: "Я представил данные ориентированным графом."
    topo-algorithm: "Я описал топологическую сортировку и её сложность."
    cycle-detect: "Я объяснил обнаружение цикла."
    cycle-report: "Я показал, как вывести сам цикл."
    levels: "Я получил параллельные группы послойно."
    critical-path: "Я нашёл критический путь."
    limited-workers: "Я разобрал расписание на 8 исполнителях."
