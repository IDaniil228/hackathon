template: ml/middle/ml-customer-clustering-essay.md
honest:
  why-dominated:
    - "k-средних минимизирует сумму квадратов евклидовых расстояний, поэтому денежный признак в миллионах решает всё, а клиенты с огромными суммами забирают себе отдельные центры."
    - "признак с самым большим масштабом определяет кластеры"
    - "Разница в визитах на единицы теряется рядом с разницей в рублях на миллионы."
  scaling:
    - "Денежный признак логарифмирую через log1p, потом стандартизую все числовые признаки StandardScaler или RobustScaler, а экстремальные выбросы обрезаю."
    - "без масштабирования k-means бессмыслен"
    - "np.log1p(spend), затем StandardScaler()"
  categorical:
    - "Регион можно закодировать one-hot, но тогда он получает свой вес в расстоянии; другой путь — k-prototypes или расстояние Гауэра, или кластеризовать без региона и потом сравнить регионы внутри сегментов."
    - "регион не кладу в евклидово расстояние как число"
    - "Номер региона как число дал бы ложные расстояния между регионами."
  choose-k:
    - "Число кластеров выбираю по локтю на графике инерции и по силуэту, можно ещё индекс Дэвиса — Болдина; но итог сверяю с тем, сколько сегментов маркетинг реально обслужит."
    - "силуэт для k от 2 до 10"
    - "silhouette_score(X, labels) для каждого k"
  alternatives:
    - "k-средних ищет выпуклые кластеры похожего размера и зависит от начальных центров, поэтому k-means++ и несколько запусков; если кластеры другой формы — DBSCAN, гауссовы смеси или иерархическая кластеризация."
    - "HDBSCAN сам находит выбросы"
    - "KMeans(init='k-means++', n_init=10)"
  profiling-stability:
    - "Каждый сегмент описываю размером и медианами признаков в рублях и штуках, а устойчивость проверяю повторными запусками с разными seed и на подвыборках по скорректированному индексу Рэнда."
    - "сегменты должны воспроизводиться на подвыборках"
    - "adjusted_rand_score между разбиениями двух запусков"
claims:
  echo:
    - "Я объяснил, почему кластеризация получилась такой."
    - "Я описал подготовку признаков, включая категориальный."
    - "Я назвал способы выбора числа кластеров."
    - "Я объяснил, когда k-средних не подходит."
    - "Я описал сегменты для маркетинга и проверку устойчивости."
  aware:
    why-dominated: "Я объяснил доминирование признака с большим масштабом."
    scaling: "Я масштабировал и логарифмировал признаки."
    categorical: "Я обработал категориальный признак."
    choose-k: "Я выбрал k методом локтя и силуэтом."
    alternatives: "Я назвал альтернативы k-средних."
    profiling-stability: "Я описал сегменты и проверил устойчивость."
