template: algo/senior/algo-nearest-objects-essay.md
honest:
  brute-force:
    - "Перебор — это 300 тысяч расстояний на запрос, а при 5 тысячах запросов в секунду — около 1.5·10^9 расчётов в секунду; это не помещается в 50 мс."
    - "линейный проход по всем объектам не масштабируется"
    - "3·10^5 × 5·10^3 = 1.5·10^9 операций в секунду"
  structure:
    - "Делю карту на ячейки сетки или geohash по 500 м, смотрю ячейки вокруг точки, кандидатов кладу в кучу размера 20, а если их мало, расширяю кольцо ячеек."
    - "можно взять R-дерево или k-d дерево, а в плотных местах делить ячейки мельче"
    - "Запрос k ближайших — это просмотр соседних ячеек и отбор лучших через кучу."
  updates:
    - "В сетке обновление координат — это перенос объекта из одной ячейки в другую за O(1), а k-d дерево при 60 тысячах обновлений в секунду пришлось бы постоянно перестраивать."
    - "для частых обновлений ячейки лучше деревьев"
    - "300 тысяч объектов раз в 5 секунд — 60 тысяч обновлений в секунду"
  geodesy:
    - "Градус долготы короче на севере в cos φ раз, поэтому ячейки в градусах неравны; расстояние считаю по формуле гаверсинусов или в локальной проекции города."
    - "в заполярье область поиска по долготе должна быть шире"
    - "haversine вместо евклида по градусам"
  sharding:
    - "Шардирую по городам или крупным ячейкам, данные держу в памяти с репликой; запрос у границы шарда опрашивает соседний шард и объединяет ответы."
    - "соседние шарды тоже опрашиваются для запросов у края"
    - "Каждый город живёт на своём сервере в памяти."
  tradeoffs-check:
    - "Компромисс — координаты устаревают до 5 секунд и мелкие ячейки едят память; проверю нагрузочным тестом по p99 времени запроса."
    - "нагрузочный тест с замером перцентилей"
    - "Точность жертвую ради скорости: объект мог сдвинуться за последние секунды."
claims:
  echo:
    - "Я оценил стоимость перебора всех объектов."
    - "Я предложил структуру данных и описал запрос ближайших."
    - "Я сравнил подходы к обновлению координат."
    - "Я объяснил расчёт расстояний на разных широтах."
    - "Я распределил данные по серверам."
    - "Я назвал компромиссы и способ проверки задержки."
  aware:
    brute-force: "Я оценил стоимость перебора."
    structure: "Я предложил пространственный индекс."
    updates: "Я сравнил подходы к частым обновлениям."
    geodesy: "Я учёл сжатие долготы с широтой."
    sharding: "Я предложил шардирование с обработкой границ."
    tradeoffs-check: "Я назвал компромиссы и нагрузочный тест."
