template: algo/middle/algo-shortest-path-choice-essay.md
honest:
  unit-bfs:
    - "Если все рёбра стоят одинаково, хватает обхода в ширину за O(V + E): вершины выходят из очереди в порядке неубывания расстояния."
    - "одинаковые веса — BFS"
    - "В BFS первая встреча с вершиной уже даёт кратчайшее число рёбер до неё."
  zero-one:
    - "Для весов 0 и 1 подходит 0-1 BFS на деке: по ребру веса 0 кладём вершину в начало, по ребру веса 1 — в конец, всё за O(V + E)."
    - "deque.appendleft для нулевых рёбер"
    - "Дейкстра тут избыточна, двусторонняя очередь даёт линейное время."
  dijkstra:
    - "Для неотрицательных весов беру Дейкстру с двоичной кучей, это O((V + E) log V)."
    - "heapq, O(E log V)"
    - "Пока отрицательных стоимостей нет, Дейкстра с приоритетной очередью — лучший выбор."
  negative:
    - "С отрицательными весами нужен Беллман — Форд за O(V·E)."
    - "SPFA в среднем быстрее, но в худшем случае тоже V·E"
    - "Bellman-Ford делает V−1 проход ослабления всех рёбер."
  why-dijkstra-fails:
    - "Дейкстра считает расстояние до вершины окончательным, как только достала её из кучи, а более дешёвый путь через отрицательное ребро может найтись позже."
    - "вершина уже закрыта, когда находится путь короче"
    - "Жадный выбор ломается: отрицательное ребро может уменьшить путь до уже обработанной вершины."
  negative-cycle:
    - "Если из старта достижим цикл с отрицательной суммой, кратчайшего пути нет: по циклу можно крутиться бесконечно."
    - "Делаем ещё один, V-й проход: если какое-то расстояние уменьшилось, значит есть отрицательный цикл."
    - "отрицательный цикл → ответ «минус бесконечность» для вершин после него"
  path-restore:
    - "При каждом успешном ослаблении записываем parent[v] = u, а потом идём от цели к старту по предкам и разворачиваем список."
    - "храню предка для каждой вершины"
    - "Сам путь восстанавливается по массиву prev от конечной вершины назад."
claims:
  echo:
    - "Я выбрал алгоритм для каждого из четырёх вариантов стоимостей, назвал сложность и объяснил выбор."
    - "Я объяснил, почему алгоритм Дейкстры даёт неверный ответ при отрицательных стоимостях."
    - "Я описал, что делать с циклом отрицательной стоимости."
    - "Я рассказал, как восстановить сам кратчайший путь, а не только длину."
  aware:
    unit-bfs: "Я выбрал BFS для равных весов и обосновал его."
    zero-one: "Я описал 0-1 BFS для весов ноль и один."
    dijkstra: "Я выбрал Дейкстру с кучей и назвал её сложность."
    negative: "Я предложил Беллмана — Форда для отрицательных весов."
    why-dijkstra-fails: "Я объяснил, почему Дейкстра ломается на отрицательных рёбрах."
    negative-cycle: "Я описал обнаружение отрицательного цикла."
    path-restore: "Я объяснил восстановление пути через предков."
