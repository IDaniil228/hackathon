template: algo/junior/algo-hash-lookup-essay.md
honest:
  complexity-now:
    - "Оператор in по списку просматривает элементы по одному, поэтому на каждую из 200 тысяч записей уходит до 100 тысяч сравнений — всего порядка 2·10^10 операций."
    - "сейчас сложность O(n · m)"
    - "Поиск в списке линейный, а он вызывается в цикле, отсюда квадратичное время и полчаса работы."
  set-choice:
    - "Второй набор нужно положить в set: проверка вхождения в множество в среднем занимает O(1)."
    - "blocked = set(ids), дальше if x in blocked"
    - "Множество подходит лучше списка, потому что ищет элемент по хэшу, а не перебором."
  hash-inside:
    - "Множество в Python — хэш-таблица: хэш ключа выбирает ячейку, при коллизии ищется следующая свободная, а при заполнении таблица увеличивается."
    - "если у многих ключей совпадут ячейки, поиск выродится в O(n)"
    - "В Python коллизии разрешаются открытой адресацией, а не цепочками."
  total-complexity:
    - "Построение множества стоит O(m), а n проверок по O(1), так что итог O(n + m) в среднем."
    - "после исправления скрипт линейный по сумме размеров наборов"
    - "O(n + m) вместо O(n · m)"
  hashable-key:
    - "Список изменяемый и не хэшируемый, set выдаст TypeError: unhashable type: 'list'; ключ из двух значений надо делать кортежем."
    - "вместо [a, b] использовать (a, b)"
    - "Ключ из пары значений должен быть неизменяемым, поэтому tuple, а не list."
  dict-for-data:
    - "Если нужны поля записи, лучше словарь: ключ — идентификатор, значение — сама запись."
    - "records = {r.id: r for r in second}"
    - "dict даёт и проверку вхождения, и запись по ключу за O(1) в среднем."
claims:
  echo:
    - "Я оценил, сколько операций выполняет скрипт и почему он работает долго."
    - "Я выбрал структуру данных для второго набора и описал её устройство и сложность."
    - "Я назвал сложность всего скрипта после исправления."
    - "Я объяснил, что будет с ключом из списка и как это исправить."
    - "Я сказал, что использовать, чтобы получить поля записи."
  aware:
    complexity-now: "Я правильно оценил квадратичную сложность поиска по списку."
    set-choice: "Я выбрал множество с проверкой за O(1)."
    hash-inside: "Я описал устройство хэш-таблицы и её худший случай."
    total-complexity: "Я назвал итоговую линейную сложность."
    hashable-key: "Я объяснил, почему список нельзя сделать ключом, и предложил кортеж."
    dict-for-data: "Я предложил словарь для получения полей записи."
