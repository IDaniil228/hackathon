template: ml/senior/ml-label-noise-essay.md
honest:
  agreement-metric:
    - "70 % совпадений ничего не говорят без поправки на случайность, поэтому посчитаю каппу Коэна или альфу Криппендорфа и найду классы и исполнителей, где согласие хуже всего."
    - "каппа Флейса по классам"
    - "cohen_kappa_score(labels_a, labels_b)"
  noisy-test:
    - "Тест размечен так же шумно, поэтому он искажает оценку и ограничивает её сверху; соберу эталонный набор с экспертной разметкой и буду мерить модель на нём."
    - "золотой набор из 2–3 тысяч объектов"
    - "На шумном тесте даже идеальная модель не наберёт больше согласия разметчиков."
  plateau-cause:
    - "Модель упёрлась в качество разметки: если разметчики согласны в 70 % случаев, новые шумные данные почти ничего не добавляют, а инструкция, похоже, неоднозначна."
    - "потолок задаёт шум в метках"
    - "Удвоение шумных данных не убирает сам шум."
  overlap-aggregation:
    - "Спорные объекты буду размечать 3–5 раз и объединять с учётом качества исполнителей, например моделью Dawid — Skene, плюс контрольные задания и уточнённая инструкция; при 300 тысячах оценок это около 80 тысяч объектов."
    - "взвешенное голосование вместо одной оценки"
    - "300 тысяч оценок / 3–5 на объект ≈ 60–100 тысяч объектов"
  active-learning:
    - "На разметку отправляю объекты, где модель меньше всего уверена или ансамбль расходится, добавляя разнообразие; такая выборка смещена, и это надо учитывать."
    - "uncertainty sampling"
    - "Из десятков миллионов неразмеченных беру те, где вероятность ближе к 0.5."
  noisy-training:
    - "Учу на мягких метках из долей голосов, взвешиваю объекты по уверенности и ищу подозрительные метки через confident learning, например cleanlab, отправляя их на перепроверку."
    - "устойчивые к шуму функции потерь"
    - "cleanlab.find_label_issues(labels, pred_probs)"
  risks-validation:
    - "Риски — смещение отобранной выборки, дорогие эксперты и исполнители, которые подстраиваются под контрольные задания; проверяю всё на эталонном наборе и онлайн-экспериментом."
    - "эффект меряю на золотом наборе"
    - "Контрольные задания надо менять, иначе исполнители их запомнят."
claims:
  echo:
    - "Я описал, как оценить качество разметки."
    - "Я объяснил, почему рост данных перестал помогать."
    - "Я перестроил разметку при том же бюджете."
    - "Я описал выбор объектов для разметки."
    - "Я описал обучение на шумных метках."
    - "Я назвал риски и способ проверки."
  aware:
    agreement-metric: "Я измерил согласованность каппой."
    noisy-test: "Я предложил золотой набор."
    plateau-cause: "Я объяснил плато шумом меток."
    overlap-aggregation: "Я предложил перекрытие и агрегацию Dawid — Skene."
    active-learning: "Я предложил активное обучение."
    noisy-training: "Я описал обучение на шумных метках."
    risks-validation: "Я назвал риски и проверку."
