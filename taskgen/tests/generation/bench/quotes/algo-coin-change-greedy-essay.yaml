template: algo/middle/algo-coin-change-greedy-essay.md
honest:
  greedy-verdict:
    - "Для номиналов 1, 3, 4 способ коллеги ошибается: сумму 6 он выдаст как 4 + 1 + 1, а можно 3 + 3, то есть двумя монетами вместо трёх."
    - "для 1, 7, 10 и суммы 14 жадно выйдет 10 + 1 + 1 + 1 + 1, а оптимум 7 + 7"
    - "Набор 1, 2, 5, 10 устроен так, что жадный выбор на нём всегда оптимален."
  dp-solution:
    - "dp[0] = 0, dp[s] = 1 + min(dp[s - c]) по всем номиналам c не больше s; это O(S · k) времени и O(S) памяти."
    - "для суммы до 100 000 и трёх номиналов это 300 тысяч операций"
    - "for s in range(1, S + 1): dp[s] = 1 + min(dp[s - c] for c in coins if c <= s)"
  restore:
    - "Вместе с dp[s] храню номинал, на котором достигнут минимум, и от суммы S иду назад, вычитая его, пока не дойду до нуля."
    - "массив last_coin для восстановления набора"
    - "while s > 0: result.append(last[s]); s -= last[s]"
  limited:
    - "При ограниченном запасе жадный выбор может вообще не набрать сумму, хотя набор есть: например, кончились единицы, а сумму можно собрать из троек."
    - "это ограниченный рюкзак: ДП по номиналам с учётом числа копий, запас можно разбить на части по степеням двойки"
    - "Каждый номинал с запасом q даёт log q предметов, и дальше обычный рюкзак 0-1."
  greedy-when:
    - "Для набора 1, 2, 5, 10 жадный выбор оптимален и работает за O(k); проверить набор можно, сравнив его с ДП на всех суммах до суммы двух наибольших номиналов."
    - "если на суммах меньше c_k + c_(k-1) жадный не ошибся, он не ошибается нигде"
    - "Жадный оправдан, когда набор проверен и нужна скорость на каждый запрос."
claims:
  echo:
    - "Я проверил, даёт ли способ коллеги наименьшее количество для этих номиналов."
    - "Я предложил алгоритм для любой суммы до 100 000 и оценил его сложность."
    - "Я описал, как получить сам набор номиналов."
    - "Я разобрал, что меняется при ограниченном запасе."
    - "Я объяснил, когда способ коллеги оправдан."
  aware:
    greedy-verdict: "Я правильно определил, оптимален ли жадный выбор для этого набора."
    dp-solution: "Я описал динамическое программирование и его сложность."
    restore: "Я объяснил восстановление набора номиналов."
    limited: "Я свёл ограниченный запас к ограниченному рюкзаку."
    greedy-when: "Я назвал, когда жадный алгоритм оптимален и как это проверить."
