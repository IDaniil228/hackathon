template: ml/middle/ml-imbalanced-threshold-essay.md
skip_deletion:
  probability: "предложение threshold говорит, что модель сравнивает с порогом вероятность, и факт probability остаётся в тексте"
situations:
  - id: good-1
    params:
      domain: "выявление мошеннических платежей, доля мошенничества 0.3 %"
    title: "Модель против мошенничества"
    units:
      - text: "Команда банка сделала модель для задачи: выявление мошеннических платежей, доля мошенничества 0.3 %."
        facts: [task]
      - text: "Для каждого платежа модель выдаёт вероятность того, что он мошеннический."
        facts: [probability]
      - text: "Платёж помечается как мошеннический, когда эта вероятность больше 0.5."
        facts: [threshold]
      - text: "В отчёте команда указала accuracy 0.99 и ROC AUC 0.93."
        facts: [report]
      - text: "Служба безопасности и руководство недовольны тем, как модель работает."
        facts: [business]
      - text: "Пропущенный мошеннический платёж стоит банку в среднем 40 000 рублей, а ложная тревога обходится примерно в 300 рублей на звонок клиенту."
        facts: [costs]
  - id: good-2
    params:
      domain: "предсказание поломки оборудования за сутки, доля поломок 1 %"
    title: "Прогноз поломок станков"
    units:
      - text: "На заводе команда построила модель для задачи: предсказание поломки оборудования за сутки, доля поломок 1 %."
        facts: [task]
      - text: "Модель возвращает вероятность того, что станок сломается в ближайшие сутки."
        facts: [probability]
      - text: "Станок отправляют на проверку, если вероятность превышает 0.5."
        facts: [threshold]
      - text: "Команда отчиталась точностью (accuracy) 0.99 и площадью под ROC-кривой 0.93."
        facts: [report]
      - text: "Начальник цеха недоволен результатами модели."
        facts: [business]
      - text: "Внезапная поломка останавливает линию и обходится в 2 миллиона рублей, тогда как лишняя проверка станка стоит 20 тысяч рублей."
        facts: [costs]
paraphrases:
  - phrases: [recall, полнот]
    text: "Директор спросил, какую долю реальных мошеннических случаев модель вообще замечает."
  - phrases: [SMOTE]
    text: "Стажёр предложил искусственно синтезировать новые примеры редкого класса, интерполируя между ближайшими соседями."
negations:
  - situation: good-1
    fact: threshold
    text: "Порог 0.5 команда не использует: платёж помечается, когда вероятность больше 0.05."
  - situation: good-1
    fact: business
    text: "Служба безопасности и руководство довольны тем, как модель работает, и претензий не высказывают."
