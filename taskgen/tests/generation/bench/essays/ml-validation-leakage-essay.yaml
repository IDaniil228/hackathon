template: ml/junior/ml-validation-leakage-essay.md
skip_deletion: {}
situations:
  - id: good-1
    params:
      domain: "предсказание продаж магазина по дням"
    title: "Прогноз продаж магазина"
    units:
      - text: "Начинающий аналитик Игорь строит модель для задачи: предсказание продаж магазина по дням."
        facts: [task]
      - text: "Данные о продажах копились десять месяцев, и у каждой строки есть дата."
        facts: [dated-records]
      - text: "Сначала Игорь заполнил пропуски в признаках средними значениями, которые посчитал по всей таблице ещё до разделения на части."
        facts: [impute-all]
      - text: "Затем он привёл признаки к одному масштабу, взяв среднее и стандартное отклонение тоже по всей таблице до разделения."
        facts: [scale-all]
      - text: "После этого Игорь перемешал строки и случайным образом поделил их на обучающую и проверочную части."
        facts: [random-split]
      - text: "Он обучил градиентный бустинг."
        facts: [boosting]
      - text: "Глубину деревьев и скорость обучения Игорь подбирал по качеству на проверочной части, и по ней же он указал итоговое качество в отчёте."
        facts: [tuning-on-report]
      - text: "На обучающей части точность модели составила 0.99."
        facts: [train-score]
      - text: "Когда модель запустили на свежих данных, качество оказалось заметно хуже."
        facts: [worse-after-launch]
  - id: good-2
    params:
      domain: "классификация отзывов на положительные и отрицательные"
    title: "Модель для отзывов"
    units:
      - text: "В интернет-магазине стажёр Алина делает модель для задачи: классификация отзывов на положительные и отрицательные."
        facts: [task]
      - text: "Отзывы собирались с весны по осень, у каждого отзыва сохранена дата публикации."
        facts: [dated-records]
      - text: "Пропущенные значения признаков Алина заменила средним, вычисленным по всем отзывам сразу, ещё до того как делить данные."
        facts: [impute-all]
      - text: "Признаки она нормировала, тоже считая параметры нормировки по всем отзывам до деления."
        facts: [scale-all]
      - text: "Потом Алина разделила отзывы на две части случайным образом."
        facts: [random-split]
      - text: "В качестве модели она взяла градиентный бустинг."
        facts: [boosting]
      - text: "Число деревьев Алина выбирала, сравнивая качество на второй части, и на этой же второй части посчитала итоговую метрику для отчёта."
        facts: [tuning-on-report]
      - text: "Точность на обучающих данных вышла 0.99."
        facts: [train-score]
      - text: "После запуска на новых отзывах модель стала ошибаться заметно чаще."
        facts: [worse-after-launch]
paraphrases:
  - phrases: [утечк]
    text: "Позже выяснилось, что сведения из проверочной части просочились в обучение."
  - phrases: [переобуч]
    text: "Модель просто запомнила обучающие примеры вместо того, чтобы найти общие закономерности."
negations:
  - situation: good-1
    fact: scale-all
    text: "Затем он привёл признаки к одному масштабу, но параметры масштабирования считал только по обучающей части, уже после разделения."
  - situation: good-1
    fact: tuning-on-report
    text: "Глубину деревьев Игорь подбирал на отдельной части данных, а итоговое качество в отчёте посчитал на другой части, которую до этого не трогал."
