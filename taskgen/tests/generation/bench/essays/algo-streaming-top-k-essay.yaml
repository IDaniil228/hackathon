situations:
  - id: good-1
    params:
      domain: "поисковые запросы пользователей"
      memory_mb: 64
    title: "Блок популярных запросов"
    units:
      - text: "Поисковый сервис хочет показывать на главной странице блок самых популярных запросов."
        facts: []
      - text: "Блок смотрят редакторы и пользователи, чтобы видеть, что сейчас ищут."
        facts: []
      - text: "За сутки приходит около миллиарда запросов."
        facts: [volume]
      - text: "Разных формулировок запросов среди них порядка ста миллионов."
        facts: [distinct]
      - text: "Поток разбирают шестнадцать серверов."
        facts: [servers]
      - text: "Каждому серверу под учёт популярности выделено не больше 64 мегабайт оперативной памяти."
        facts: [memory]
      - text: "Раз в минуту блок должен обновляться и показывать сотню самых частых запросов за последний час."
        facts: [query]
  - id: good-2
    params:
      domain: "хэштеги в сообщениях социальной сети"
      memory_mb: 256
    title: "Тренды по хэштегам"
    units:
      - text: "Социальная сеть собирается показывать в приложении ленту трендов по хэштегам для маркетологов и обычных читателей."
        facts: []
      - text: "В сообщениях за день появляется примерно 10^9 упоминаний хэштегов."
        facts: [volume]
      - text: "Уникальных хэштегов при этом около 10^8."
        facts: [distinct]
      - text: "Обработкой занимается кластер из 16 машин."
        facts: [servers]
      - text: "Под таблицу популярности на каждой машине можно занять максимум 256 МБ."
        facts: [memory]
      - text: "Каждую минуту лента должна отдавать топ-100 хэштегов по частоте за последние шестьдесят минут."
        facts: [query]
paraphrases:
  - phrases: [Count-Min, скетч, sketch]
    text: "Архитектор предложил хранить вместо точных счётчиков небольшую таблицу из нескольких строк, где каждая строка индексируется своей хеш-функцией, и брать минимум по строкам."
  - phrases: [затухан]
    text: "Ещё обсуждали, чтобы старые события постепенно весили меньше новых и экспоненциально теряли вес со временем."
negations:
  - situation: good-1
    fact: servers
    text: "Поток разбирает один сервер, и распределять его по машинам не планируют."
  - situation: good-1
    fact: query
    text: "Обновлять блок раз в минуту не требуется: достаточно раз в сутки показать сотню самых частых запросов за прошлый день."
