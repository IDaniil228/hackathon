template: algo/middle/algo-shortest-path-choice-essay.md
skip_deletion: {}
situations:
  - id: good-1
    params:
      domain: "сеть складов и дорог между ними"
    title: "Тарифы на перевозку между складами"
    units:
      - text: "Логистическая компания хранит карту своей сети: склады служат вершинами, дороги между ними служат рёбрами, а стоимость ребра означает цену перевозки по дороге."
        facts: []
      - text: "Каждая дорога проходима только в одну сторону, складов около ста тысяч, а дорог около миллиона."
        facts: [size]
      - text: "Планировщику нужно знать самую дешёвую перевозку от центрального склада до каждого другого склада."
        facts: [single-source]
      - text: "Команда обсуждает четыре варианта тарифов."
        facts: []
      - text: "Вариант 1: любая дорога стоит одинаково, независимо от расстояния."
        facts: [equal-costs]
      - text: "Вариант 2: дорога либо бесплатна для своих грузовиков и стоит 0, либо стоит ровно 1 условную единицу."
        facts: [zero-one-costs]
      - text: "Вариант 3: цена дороги задана дробным числом вроде 12.5 рубля за тонну и никогда не бывает меньше нуля."
        facts: [non-negative-costs]
      - text: "Вариант 4: на некоторых дорогах партнёры доплачивают за перевозку, поэтому часть цен отрицательна."
        facts: [negative-costs]
  - id: good-2
    params:
      domain: "сеть обменных курсов между валютами"
    title: "Цепочки обмена валют"
    units:
      - text: "Финтех-стартап моделирует обмен валют как граф: валюты служат вершинами, возможные обмены служат рёбрами, а стоимость ребра означает издержки на обмен."
        facts: []
      - text: "Обмен из одной валюты в другую не всегда доступен в обратную сторону, поэтому рёбра направленные, а в графе примерно 10^5 вершин и 10^6 рёбер."
        facts: [size]
      - text: "Сервису нужны самые дешёвые цепочки обменов из рубля во все остальные валюты."
        facts: [single-source]
      - text: "Аналитики рассматривают четыре схемы издержек."
        facts: []
      - text: "Вариант 1: каждый обмен обходится в одну и ту же фиксированную комиссию."
        facts: [equal-costs]
      - text: "Вариант 2: обмен внутри одной платёжной системы бесплатный, а между системами стоит одну единицу, так что издержка всегда 0 или 1."
        facts: [zero-one-costs]
      - text: "Вариант 3: издержки выражены неотрицательными дробными числами, например 0.35 процента от суммы."
        facts: [non-negative-costs]
      - text: "Вариант 4: на части обменов действует кэшбэк, и издержки на них отрицательные."
        facts: [negative-costs]
paraphrases:
  - phrases: [BFS, в ширину]
    text: "Стажёр предложил обходить граф слоями от старта, складывая вершины в обычную очередь."
  - phrases: [Беллман]
    text: "Тимлид вспомнил классический алгоритм американского математика, который придумал динамическое программирование, и сказал, что тот справляется с отрицательными ценами."
negations:
  - situation: good-1
    fact: zero-one-costs
    text: "Вариант 2: стоимость дороги не ограничена значениями 0 и 1 и может быть любым целым числом."
  - situation: good-1
    fact: single-source
    text: "Планировщику не нужны перевозки от одного склада: ему нужны самые дешёвые маршруты между всеми парами складов."
