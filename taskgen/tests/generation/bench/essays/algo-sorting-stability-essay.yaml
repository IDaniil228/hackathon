template: algo/junior/algo-sorting-stability-essay.md
skip_deletion:
  small-range: "предложение two-fields говорит, что значений первого поля всего несколько, и без предложения small-range факт остаётся спорным"
situations:
  - id: good-1
    params:
      domain: "таблица сотрудников с отделом и стажем в годах"
    title: "Кадровая таблица для бухгалтерии"
    units:
      - text: "Ольга ведёт кадровую таблицу сотрудников большой компании."
        facts: []
      - text: "У каждой записи два поля: отдел, у которого всего несколько возможных значений, и стаж в годах, который может быть любым числом."
        facts: [two-fields]
      - text: "Отделов в компании двадцать три, и их список меняется раз в несколько лет."
        facts: [small-range]
      - text: "Сейчас таблица выгружена из учётной системы уже отсортированной по стажу."
        facts: [current-order]
      - text: "Коллеге из бухгалтерии нужна та же таблица, сгруппированная по отделам, причём внутри каждого отдела сотрудники должны идти в прежнем порядке по стажу."
        facts: [goal]
      - text: "Таблица обновляется каждое утро, и в ней около двух миллионов строк."
        facts: []
  - id: good-2
    params:
      domain: "список рейсов аэропорта с авиакомпанией и временем вылета"
    title: "Список рейсов для дежурного"
    units:
      - text: "Диспетчерская служба аэропорта каждое утро получает список рейсов на сутки."
        facts: []
      - text: "В записи о рейсе есть авиакомпания, которых в списке лишь несколько разных, и время вылета, которое может быть любым."
        facts: [two-fields]
      - text: "Авиакомпаний, летающих из этого аэропорта, не больше тридцати."
        facts: [small-range]
      - text: "Список приходит из системы бронирования уже упорядоченным по времени вылета."
        facts: [current-order]
      - text: "Дежурному нужен список, где рейсы собраны по авиакомпаниям, а внутри каждой авиакомпании остаются в порядке времени вылета."
        facts: [goal]
paraphrases:
  - phrases: [составн]
    text: "Коллега предложил сравнивать записи сразу по паре значений: сначала по первому полю, а при равенстве по второму."
  - phrases: [подсчет]
    text: "Тимлид заметил, что при таком малом числе вариантов можно пройти по данным один раз, разложить строки по корзинам для каждого значения и склеить корзины."
negations:
  - situation: good-1
    fact: current-order
    text: "Сейчас таблица выгружена из учётной системы в произвольном порядке, без сортировки по стажу."
  - situation: good-1
    fact: goal
    text: "Коллеге из бухгалтерии нужна та же таблица по отделам, но порядок сотрудников внутри отдела ему не важен и сохранять его не нужно."
