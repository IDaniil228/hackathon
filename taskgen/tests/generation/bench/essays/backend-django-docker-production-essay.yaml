template: backend/senior/backend-django-docker-production-essay.md
skip_deletion: {}
situations:
  - id: good-1
    params:
      domain: "маркетплейс подержанной техники"
      migration: "переименование столбца, который читает текущая версия кода"
    title: "Переезд маркетплейса в контейнеры"
    units:
      - text: "Маркетплейс подержанной техники переезжает со старой инфраструктуры в контейнеры, и кандидат приходит в команду ведущим бэкенд-разработчиком."
        facts: []
      - text: "Сейчас всё приложение на Django крутится на одной виртуальной машине: его запускают командой runserver от пользователя root."
        facts: [current]
      - text: "В целевой схеме приложение собирается в образ, база переезжает в PostgreSQL как управляемый сервис облака, а перед четырьмя репликами приложения стоит балансировщик."
        facts: [target]
      - text: "В ближайший релиз входит миграция, которая переименовывает столбец, читаемый текущей версией кода."
        facts: [migration]
      - text: "Релиз хотят выкатить без простоя."
        facts: []
  - id: good-2
    params:
      domain: "платформа онлайн-курсов с оплатой подписки"
      migration: "добавление обязательного столбца с вычисляемым значением в таблицу на 50 млн строк"
    title: "Платформа курсов уходит в контейнеры"
    units:
      - text: "Платформа онлайн-курсов с оплатой подписки готовится к переезду в контейнеры."
        facts: []
      - text: "Пока Django-приложение работает на единственной виртуалке через manage.py runserver, и процесс запущен под root."
        facts: [current]
      - text: "После переезда будет образ приложения, четыре его реплики за балансировщиком и управляемый PostgreSQL от облачного провайдера."
        facts: [target]
      - text: "Ближайший релиз несёт миграцию: в таблицу на 50 млн строк добавляется обязательный столбец, значение которого вычисляется."
        facts: [migration]
      - text: "Кандидат выходит в команду ведущим бэкенд-разработчиком."
        facts: []
paraphrases:
  - phrases: [расширить, сузить, expand]
    text: "Архитектор предлагает менять схему базы в два этапа: сначала добавить новое рядом со старым, а лишнее удалить только в следующем релизе."
  - phrases: [readiness]
    text: "Балансировщик будет пускать трафик на реплику только после того, как она ответит на специальный адрес проверки готовности."
negations:
  - situation: good-1
    fact: current
    text: "Сейчас Django работает на одной виртуальной машине, но не через runserver и не под root: его запускает отдельный системный пользователь."
  - situation: good-1
    fact: target
    text: "В целевой схеме не будет ни балансировщика, ни реплик: одна копия приложения в образе и PostgreSQL на той же машине."
