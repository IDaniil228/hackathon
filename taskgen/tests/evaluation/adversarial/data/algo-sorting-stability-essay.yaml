answers:
  - id: full
    class: valid-full
    expect: [0.75, 1.0]
    content: |
      Устойчивая сортировка — это сортировка, при которой записи с равными ключами остаются в том же взаимном порядке, что и до сортировки. В нашем журнале это важно: записи уже упорядочены по фамилии читателя, а коллеге нужен порядок по дню визита, причём внутри одного дня фамилии должны остаться по алфавиту. Если отсортировать журнал по дню визита устойчивой сортировкой, порядок по фамилии внутри каждого дня сохранится сам.

      В общем случае порядок по двум полям получают двумя устойчивыми сортировками: сначала по второстепенному полю (фамилии), затем по главному (дню визита). Вторая сортировка обязана быть устойчивой, иначе она перемешает записи с одинаковым днём и разрушит порядок по фамилии, полученный первым проходом. Можно и одной сортировкой с составным ключом: `sorted(journal, key=lambda r: (r.day, r.surname))`. В нашей ситуации первый проход уже сделан, поэтому достаточно одной устойчивой сортировки по дню.

      Нижняя оценка для любой сортировки сравнением — Ω(n log n) сравнений. Объяснение через дерево решений: каждый лист соответствует одной из n! перестановок, значит листьев не меньше n!, а высота дерева не меньше log2(n!) ≈ n log n. Эта оценка относится только к алгоритмам, которые сравнивают элементы.

      Если ключи берутся из небольшого диапазона, можно сортировать быстрее. День визита принимает не больше 31 значения, поэтому подходит сортировка подсчётом: считаем, сколько записей пришлось на каждый день, по префиксным суммам находим начало каждого дня и раскладываем записи по порядку. Она не сравнивает элементы, работает за O(n + k), где k = 31, и при проходе по входу слева направо устойчива. Для больших ключей так же работает поразрядная сортировка.

      Встроенная сортировка Python (sorted и list.sort) — это Timsort, а с версии 3.11 в нём правило слияния серий из Powersort. Она устойчива, работает за O(n log n) в худшем случае, а на почти упорядоченных данных близка к O(n), потому что находит уже упорядоченные серии и только сливает их.

  - id: alt
    class: valid-paraphrase
    expect: [0.7, 1.0]
    content: |
      Сортировку называют стабильной, если она не меняет относительный порядок элементов с одинаковым ключом: из двух записей с одним днём раньше окажется та, что была раньше во входе. Для журнала библиотеки это ровно то, что нужно: сейчас записи идут по фамилиям, и после стабильной сортировки по дню посещения внутри каждого дня фамилии останутся в алфавитном порядке.

      Когда исходного порядка нет, делают два прохода: первым сортируют по менее важному полю, по фамилии, вторым — по более важному, по дню. Второй проход должен быть стабильным: нестабильный алгоритм при равных днях переставит записи как угодно и потеряет порядок фамилий. Альтернатива — один проход с ключом-кортежем (день, фамилия).

      Алгоритм, который только сравнивает пары элементов, не может в худшем случае обойтись меньше чем порядка n log n сравнений. Это следует из того, что разных входных перестановок n!, каждое сравнение даёт один бит информации, и нужно log2(n!) бит, а это порядка n log n.

      У дня визита всего 31 возможное значение, так что можно обойтись без сравнений: заведём 31 корзину, пройдём по журналу и положим каждую запись в корзину её дня, затем выпишем корзины подряд. Это подсчёт с раскладкой по корзинам, время O(n + 31), и он сохраняет порядок внутри корзины, то есть стабилен.

      В Python list.sort и sorted реализованы алгоритмом Timsort — гибридом сортировки слиянием и вставками. Он стабилен, в худшем случае O(n log n), а если данные почти отсортированы, он находит готовые возрастающие куски (runs) и почти ничего не делает, приближаясь к линейному времени.

