# Ответы на задание backend/middle/backend-django-orm-performance-essay.md, seed 2: список
# заказов с покупателем и товарами в интернет-магазине. Ожидаемые диапазоны заданы до прогона.
template: backend/middle/backend-django-orm-performance-essay.md
seed: 2
answers:
  - id: full
    class: valid-full
    expect: [0.75, 1.0]
    content: |
      1. Поиск причины. Сначала смотрю, сколько SQL-запросов делает эндпоинт: django-debug-toolbar (для DRF через browsable API) или логирование SQL через логгер django.db.backends, в тестах — connection.queries. Для медленных запросов снимаю план через EXPLAIN ANALYZE в PostgreSQL. На проде помогает APM (Sentry Performance, New Relic) или профилировщик вроде py-spy. При 50 элементах на странице я ожидаю увидеть 100–150 запросов вместо трёх.

      2. Проблемы в коде. Главная — N+1: на каждый заказ сериализатор отдельно ходит в базу за покупателем (ForeignKey), отдельно за товарами (ManyToMany) и отдельно вызывает .count(). Исправление:

      ```python
      from django.db.models import Count, Prefetch

      orders = (
          Order.objects.filter(status=status)
          .select_related("customer")
          .prefetch_related(Prefetch("products", queryset=Product.objects.only("id", "name", "price")))
          .annotate(items_count=Count("products", distinct=True))
          .order_by("-created_at")
      )
      ```

      select_related для ForeignKey делает JOIN и забирает покупателя тем же запросом. prefetch_related для ManyToMany делает один отдельный запрос за товарами всех заказов страницы и склеивает их с заказами в Python. Подсчёт переношу в запрос через annotate(Count(...)), а в сериализаторе читаю поле items_count вместо obj.products.count(). Тяжёлые поля, которые не нужны в списке, убираю через only/defer.

      3. База данных. Таблица на несколько миллионов строк, фильтр и сортировка по дате создания — нужен составной индекс под этот запрос, например `models.Index(fields=["status", "-created_at"])` в Meta модели с миграцией (на проде — CREATE INDEX CONCURRENTLY). До и после смотрю план через EXPLAIN ANALYZE: должен уйти Seq Scan и сортировка. На глубоких страницах OFFSET дорогой, поэтому стоит перейти на курсорную пагинацию DRF (CursorPagination).

      4. Проверка и защита от регресса. Замеряю время ответа до и после (было около 3 секунд, ожидаю десятки миллисекунд) и число запросов. В тесты добавляю проверку числа запросов: `with self.assertNumQueries(3): client.get(url)` или фикстуру django_assert_num_queries в pytest-django, чтобы новое поле в сериализаторе не вернуло N+1 незаметно. Кэширование ответа возможно, но только с продуманной инвалидацией при изменении заказов, и оно не заменяет исправление запросов.

  - id: alt
    class: valid-paraphrase
    expect: [0.7, 1.0]
    content: |
      Начну с измерений. Включу вывод всех SQL-запросов (LOGGING для django.db.backends на DEBUG) или поставлю Django Debug Toolbar и посмотрю, сколько запросов уходит на одну страницу. Для самого тяжёлого запроса выполню EXPLAIN ANALYZE в psql.

      Почти наверняка это классическая проблема «N+1 запрос»: view достаёт 50 заказов одним запросом, а потом сериализатор для каждого заказа делает ещё запрос за покупателем, ещё запрос за списком товаров и ещё один COUNT. Получается около 150 запросов на страницу.

      Исправляю так: покупатель — внешний ключ, его подтягиваю JOIN-ом через `.select_related("customer")`. Товары — связь многие-ко-многим, JOIN тут размножил бы строки, поэтому `.prefetch_related("products")`: Django сделает второй запрос `WHERE order_id IN (...)` и сам разложит товары по заказам. Количество товаров считаю в базе: `.annotate(products_total=Count("products"))`, а в сериализаторе `products_total = serializers.IntegerField(read_only=True)` вместо метода с `.count()`.

      На стороне PostgreSQL добавлю индекс, который покрывает и условие фильтра, и сортировку по created_at: `class Meta: indexes = [models.Index(fields=["status", "-created_at"])]`, применю миграцией и сравню планы до и после.

      Чтобы проблема не вернулась, напишу тест с `django_assert_num_queries(3)` на этот эндпоинт и зафиксирую время ответа в нагрузочном прогоне до и после изменений.

  - id: partial
    class: valid-partial
    expect: [0.25, 0.7]
    content: |
      Скорее всего проблема N+1: на каждый из 50 заказов сериализатор делает отдельные запросы за покупателем и товарами и ещё вызывает .count(). Увидеть это можно, если включить логирование SQL-запросов или поставить django-debug-toolbar.

      Исправление: для покупателя (ForeignKey) использовать select_related("customer"), чтобы он пришёл в том же запросе через JOIN. Для товаров (ManyToMany) — prefetch_related("products"), это отдельный запрос, который Django склеивает с заказами в Python.

      Что делать с базой и как проверять, я бы уточнил у старших коллег.

  - id: typos
    class: valid-typos
    expect: [0.7, 1.0]
    content: |
      сначало посмотрю скольк запросов идет на страницу - django-debug-toolbar или логирование sql (django.db.backends), плюс EXPLAIN ANALYZE на тяжелый запрос

      проблема в коде - N+1: на каждый заказ сериализатор отдельно ходит в базу за покупателем, за товарами и делает .count(). итого ~150 запросов на 50 заказов

      фикс:
      ```python
      qs = Order.objects.filter(status=s).select_related("customer").prefetch_related("products").annotate(cnt=Count("products")).order_by("-created_at")
      ```
      select_related - джоин для FK (покупатель), prefetch_related - отдельный запрос для m2m (товары) и склейка в питоне, annotate Count вместо .count() в сериализаторе

      в базе: составной индекс под фильтр и сортировку models.Index(fields=["status","-created_at"]) миграцией, проверить план EXPLAIN до и после

      проверка: замерить время до/после и написать тест assertNumQueries чтоб N+1 не вернулся. еще можно only() для тяжелых полей и курсорную пагинацию вместо offset

