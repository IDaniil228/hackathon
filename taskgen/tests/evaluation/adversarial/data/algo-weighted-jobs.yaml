    content: |
      from itertools import combinations


      def max_profit(jobs, gap):
          best = 0
          for size in range(len(jobs) + 1):
              for chosen in combinations(sorted(jobs), size):
                  if all(b[0] >= a[1] + gap for a, b in zip(chosen, chosen[1:])):
                      best = max(best, sum(job[2] for job in chosen))
          return best

