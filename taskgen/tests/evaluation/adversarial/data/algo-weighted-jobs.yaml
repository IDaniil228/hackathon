    expect: [0.7, 1.0]
    content: |
      import bisect


      def max_profit(jobs, gap):
          # Динамика с конца: f[i] — лучшая прибыль, если выбирать только из работ
          # с номера i в порядке начала. Следующая совместимая работа — первая, чьё
          # начало не раньше end + gap, её ищем бинарным поиском по началам.
          jobs = sorted(jobs)
          starts = [s for s, _, _ in jobs]
          n = len(jobs)
          f = [0] * (n + 1)
          for i in range(n - 1, -1, -1):
              s, e, p = jobs[i]
              nxt = bisect.bisect_left(starts, e + gap, i + 1)
              f[i] = max(f[i + 1], p + f[nxt])
          return f[0]

