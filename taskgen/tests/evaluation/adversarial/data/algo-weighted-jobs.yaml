  - id: full
    class: valid-full
    expect: [0.75, 1.0]
    content: |
      from bisect import bisect_right


      def max_profit(jobs: list[list[int]], gap: int) -> int:
          """Наибольшая прибыль набора совместимых работ за O(n log n)."""
          ordered = sorted(jobs, key=lambda job: job[1])
          # ready[i] — момент, с которого после i-й работы можно начать следующую.
          ready = [end + gap for _, end, _ in ordered]
          # best[i] — лучшая прибыль среди первых i работ по времени окончания.
          best = [0] * (len(ordered) + 1)
          for i, (start, _, profit) in enumerate(ordered):
              # Работы с ready <= start совместимы с i-й; равенство допустимо.
              compatible = bisect_right(ready, start, 0, i)
              best[i + 1] = max(best[i], best[compatible] + profit)
          return best[-1]

  - id: alt
