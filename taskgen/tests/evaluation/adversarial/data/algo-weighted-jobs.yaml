      def max_profit(jobs, gap):
          # Решение: динамика best[i + 1] = max(best[i], best[compatible] + profit)
          # по работам, отсортированным по окончанию; предшественник ищется бинарным
          # поиском bisect_right по моментам end + gap, равенство допустимо. Жадный
          # выбор не используется. Сложность O(n log n), память O(n).
          total = 0
          free = None
          for start, end, profit in sorted(jobs, key=lambda job: job[1]):
              if free is None or start >= free:
                  total += profit
                  free = end + gap
          return total

