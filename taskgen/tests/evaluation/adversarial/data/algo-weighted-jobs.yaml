      import bisect
      def max_profit(jobs,gap):
          #сортируем по концу
          J=sorted(jobs,key=lambda x:x[1])
          ends=[]
          for j in J: ends.append(j[1]+gap)
          dp=[0]*(len(J)+1)
          for i in range(len(J)):
              s,e,p=J[i]
              # ищим последнюю совместимую бинпоиском
              k=bisect.bisect_right(ends,s,0,i)
              if dp[k]+p>dp[i]: dp[i+1]=dp[k]+p
              else: dp[i+1]=dp[i]
          return dp[len(J)]

  - id: slow
    class: valid-slow
    expect: [0.6, 0.95]
    content: |
      def max_profit(jobs: list[list[int]], gap: int) -> int:
          """Динамика по работам, отсортированным по окончанию; предшественник ищется
          линейным проходом назад, поэтому O(n^2)."""
          ordered = sorted(jobs, key=lambda job: job[1])
          best = [0] * (len(ordered) + 1)
          for i, (start, _, profit) in enumerate(ordered):
              j = i
              while j > 0 and ordered[j - 1][1] + gap > start:
                  j -= 1
              best[i + 1] = max(best[i], best[j] + profit)
          return best[-1]

