answers:
  - id: full
    class: valid-full
    expect: [0.75, 1.0]
    content: |
      std::vector<std::string> top_k(std::vector<std::string> names, std::vector<int> scores, int k) {
          std::vector<size_t> order(names.size());
          std::iota(order.begin(), order.end(), 0);
          // Строгий порядок: баллы по убыванию, при равенстве имя по возрастанию.
          auto better = [&](size_t a, size_t b) {
              if (scores[a] != scores[b]) return scores[a] > scores[b];
              return names[a] < names[b];
          };
          const size_t take = k <= 0 ? 0 : std::min(static_cast<size_t>(k), order.size());
          std::partial_sort(order.begin(), order.begin() + take, order.end(), better);
          std::vector<std::string> result;
          result.reserve(take);
          for (size_t i = 0; i < take; ++i) result.push_back(names[order[i]]);
          return result;
      }

  - id: alt
    class: valid-paraphrase
    expect: [0.7, 1.0]
    content: |
      std::vector<std::string> top_k(std::vector<std::string> names, std::vector<int> scores, int k) {
          if (k <= 0) return {};
          // Пара (-балл, имя): обычный порядок пар и есть порядок рейтинга.
          std::vector<std::pair<int, std::string>> rows;
          rows.reserve(names.size());
          for (size_t i = 0; i < names.size(); ++i) rows.emplace_back(-scores[i], std::move(names[i]));
          std::sort(rows.begin(), rows.end());
          const size_t take = std::min(rows.size(), static_cast<size_t>(k));
          std::vector<std::string> out;
          out.reserve(take);
          for (size_t i = 0; i < take; ++i) out.push_back(std::move(rows[i].second));
          return out;
      }

