    content: |
      std::vector<std::string> top_k(std::vector<std::string> names, std::vector<int> scores, int k) {
          std::vector<int> idx;
          for(int i=0;i<(int)names.size();i++) idx.push_back(i);
          // сортруем индексы чтоб имя и бал не разъехались
          std::sort(idx.begin(),idx.end(),[&](int a,int b){
              if(scores[a]==scores[b]) return names[a]<names[b];
              return scores[a]>scores[b];});
          std::vector<std::string> res;
          for(int i=0;i<k && i<(int)idx.size();i++) res.push_back(names[idx[i]]);
          return res;
      }

