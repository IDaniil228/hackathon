    content: |
      DIGITS = "0123456789"


      def parse_number(raw: str, default: int) -> int:
          """Число из строки запроса; всё, что не только из цифр 0-9, даёт default."""
          if raw and all(ch in DIGITS for ch in raw):
              return int(raw)
          return default


      def paginate(
          items: list, page: str, per_page: str, default_per_page: int, max_per_page: int
      ) -> dict:
          """Одна страница списка и метаданные страниц."""
          page_number = max(1, parse_number(page, 1))
          size = min(max(1, parse_number(per_page, default_per_page)), max_per_page)
          total = len(items)
          pages = (total + size - 1) // size
          start = (page_number - 1) * size
          return {
              "items": items[start : start + size],
              "page": page_number,
              "per_page": size,
              "total": total,
              "pages": pages,
              "has_prev": page_number > 1,
              "has_next": page_number < pages,
          }

  - id: alt
    class: valid-paraphrase
    expect: [0.7, 1.0]
    content: |
      import re

      _ONLY_ASCII_DIGITS = re.compile(r"[0-9]+")


      def _to_int(value: str, fallback: int) -> int:
          # [0-9] в классе символов совпадает только с ASCII-цифрами, в отличие от \d.
          return int(value) if _ONLY_ASCII_DIGITS.fullmatch(value) else fallback


      def _clamp(value: int, low: int, high: int) -> int:
          return max(low, min(value, high))


      def paginate(items, page, per_page, default_per_page, max_per_page):
          current = max(_to_int(page, 1), 1)
          size = _clamp(_to_int(per_page, default_per_page), 1, max_per_page)
          total = len(items)
          pages, rest = divmod(total, size)
          if rest:
              pages += 1
          offset = (current - 1) * size
          chunk = items[offset : offset + size]
          return dict(
              items=chunk,
              page=current,
              per_page=size,
              total=total,
              pages=pages,
              has_prev=current > 1,
              has_next=current < pages,
          )

