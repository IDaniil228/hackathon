    content: |
      def paginate(items, page, per_page, default_per_page, max_per_page):
          # парсим номер страницы, если не числ то по умолчанию
          if page != "" and all(c in "0123456789" for c in page):
              pageNum = int(page)
          else:
              pageNum = 1
          if pageNum < 1:
              pageNum = 1
          # размер старницы
          if per_page != "" and all(c in "0123456789" for c in per_page):
              Size = int(per_page)
          else:
              Size = default_per_page
          if Size < 1: Size = 1
          if Size > max_per_page: Size = max_per_page
          N = len(items)
          Pages = N // Size
          if N % Size != 0: Pages = Pages + 1
          s = (pageNum-1)*Size
          return {"items": items[s:s+Size], "page": pageNum, "per_page": Size, "total": N,
                  "pages": Pages, "has_prev": pageNum > 1, "has_next": pageNum < Pages}

