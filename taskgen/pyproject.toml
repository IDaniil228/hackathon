[project]
name = "taskgen"
version = "0.1.0"
description = "Сервис генерации и оценки заданий для теста на грейд"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pgvector",
    "httpx",
    "pyyaml",
    "python-multipart>=0.0.32",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
]

[dependency-groups]
# radon и lizard сервису не нужны: анализаторы работают в песочнице. Здесь они для тестов,
# которые исполняют драйвер анализа локально.
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.16.10",
    "radon>=6.0.1",
    "lizard>=1.24.1",
]
# Проверка фактов эссе моделью NLI (generation/nli.py). Не входит в группы по умолчанию:
# onnxruntime с токенизатором весят около 150 МБ против 0.9–5 ГБ у torch.
nli = [
    "onnxruntime",
    "tokenizers",
    "huggingface-hub",
    "numpy",
]

[project.scripts]
taskgen = "taskgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: нужен поднятый docker-compose (Postgres, Piston, LLM)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
