name: fsp-platform

# Платформа собирается из сервисов, у каждого свой compose: база (db/), сервис заданий
# (taskgen/), сервис подбора (matcher/). Каждый поднимается и отдельно, а отсюда вся
# платформа поднимается одной командой в одной сети, где сервис доступен по имени:
# postgres:5432, taskgen:8000, matcher:8000. taskgen и matcher сами подключают db/,
# повторное подключение одного файла Compose объединяет. matcher работает в базе api и
# ждёт её миграций: matcher/docker-compose.yml.
include:
  - db/docker-compose.yml
  - taskgen/docker-compose.yml
  - matcher/docker-compose.yml

services:
  api:
    build: {context: ., dockerfile: api/Dockerfile}
    image: fsp-platform-api:local
    restart: unless-stopped
    depends_on:
      api-db-init: {condition: service_completed_successfully}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fsp_api:${API_DB_PASSWORD:?Set API_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TASKGEN_URL: http://taskgen:8000
      MATCHER_URL: http://matcher:8000
    volumes:
      - api-documents:/storage
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s

  api-migrate:
    build: {context: ., dockerfile: api/Dockerfile}
    image: fsp-platform-api:local
    depends_on:
      postgres: {condition: service_healthy}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    user: "${UID:-1000}:${GID:-1000}"
    volumes: ["./db:/sql"]
    command: ["alembic", "upgrade", "head"]

  api-db-init:
    image: pgvector/pgvector:pg18
    depends_on:
      api-migrate: {condition: service_completed_successfully}
    env_file: .env
    environment:
      PGHOST: postgres
    volumes: ["./api/db-init.sql:/api-db-init.sql:ro"]
    command:
      - sh
      - -ec
      - >-
        export PGUSER="$$POSTGRES_USER" PGPASSWORD="$$POSTGRES_PASSWORD";
        exec psql -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1
        -v role=fsp_api -v password="$$API_DB_PASSWORD" -v db="$$POSTGRES_DB"
        -v owner="$$POSTGRES_USER" -f /api-db-init.sql

volumes:
  api-documents:
