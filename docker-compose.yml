name: fsp-platform

# Платформа собирается из сервисов, у каждого свой compose: база (db/), сервис заданий
# (taskgen/), сервис подбора (matcher/). Каждый поднимается и отдельно, а отсюда вся
# платформа поднимается одной командой в одной сети, где сервис доступен по имени:
# postgres:5432, taskgen:8000, matcher:8000. taskgen и matcher сами подключают db/,
# повторное подключение одного файла Compose объединяет. matcher работает в базе api и
# ждёт её миграций: matcher/docker-compose.yml.
include:
  - db/docker-compose.yml
  - taskgen/docker-compose.yml
  - matcher/docker-compose.yml

services:
  api:
    # Официальный python с Docker Hub, без своего Dockerfile и без локальной сборки.
    # Зависимости ставятся в api/.venv-docker и переживают перезапуск контейнера.
    # venv лежит внутри смонтированного /app, а не в своём монтировании: именованный том
    # и отсутствующий в клоне bind-каталог Docker создаёт от root, и непривилегированный
    # процесс в них не запишет.
    image: python:3.13-slim
    container_name: fsp-api
    restart: unless-stopped
    working_dir: /app
    # Контейнер работает от UID хозяина: файлы, которые создаёт alembic
    # (новые ревизии) и fspdb dump-schema, остаются доступными на правку,
    # а не появляются от root
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PATH: /app/.venv-docker/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      # Не root — значит и HOME другой; сюда pip кладёт кэш
      HOME: /tmp
    volumes:
      - ./api:/app
      - ./db:/sql
    ports:
      - "${API_PORT:-8000}:8000"
    # bash -c, а не -lc: логин-шелл перечитывает /etc/profile и затирает PATH,
    # после чего python берётся системный, а не из venv.
    # Зависимости ставятся один раз: маркер хранит хеш pyproject.toml.
    # Инструменты вызываются через python -m: шебанги скриптов venv привязаны к пути,
    # под которым venv создан, а ссылка bin/python от него не зависит.
    command: >
      bash -c "
        set -e;
        VENV=/app/.venv-docker;
        test -x $$VENV/bin/python || python -m venv $$VENV;
        STAMP=$$VENV/.deps-sha;
        SHA=$$(sha256sum pyproject.toml | cut -d' ' -f1);
        if [ \"$$(cat $$STAMP 2>/dev/null)\" != \"$$SHA\" ]; then
          $$VENV/bin/python -m pip install -q --upgrade pip;
          $$VENV/bin/python -m pip install -q -e .;
          echo $$SHA > $$STAMP;
        fi;
        $$VENV/bin/python -m alembic upgrade head;
        exec $$VENV/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    # Без проверки docker compose up --wait считает здоровым и контейнер, который падает
    # в цикле. Первый старт ставит зависимости, отсюда долгий start_period.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 300s
