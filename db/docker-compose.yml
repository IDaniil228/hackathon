# Сервис базы платформы: один сервер Postgres с pgvector. Клиенты (api, taskgen) живут в
# своих базах и подключают этот файл через include. Свою роль и базу клиент создаёт сам
# одноразовым init-контейнером, поэтому этот файл о клиентах ничего не знает.
# Суперпользователь и его база берутся из .env в корне репозитория.
services:
  postgres:
    # Готовый образ с Docker Hub: PostgreSQL 18 + pgvector, ничего не собираем локально
    image: pgvector/pgvector:pg18
    container_name: fsp-postgres
    restart: unless-stopped
    env_file: ../.env
    environment:
      # Сортировка по правилам русского языка через ICU; сам поиск
      # to_tsvector('russian', ...) от локали ОС не зависит (словарь snowball)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --locale-provider=icu --icu-locale=ru-RU"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # В образах PG18+ том монтируется именно сюда, а не в /var/lib/postgresql/data
      - pgdata:/var/lib/postgresql
      # Каталог для выгрузки бэкапов изнутри контейнера
      - .:/sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    shm_size: 256mb
    command:
      - postgres
      # Умеренные настройки: решение должно подниматься на обычной рабочей машине
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500

  adminer:
    image: adminer:5
    container_name: fsp-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    profiles: ["tools"]

volumes:
  pgdata:
    name: fsp-pgdata
