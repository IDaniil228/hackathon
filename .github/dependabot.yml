# Версии действий в workflow закреплены тегами; Dependabot двигает их pull request'ом.
version: 2
updates:
  - package-ecosystem: github-actions
    # Каталог / покрывает только .github/workflows; составные действия перечисляются отдельно.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
