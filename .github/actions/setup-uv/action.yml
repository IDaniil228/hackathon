name: setup-uv
description: Ставит uv закреплённой версии. Python и пакеты каждый проект берёт из своих файлов
inputs:
  working-directory:
    description: Каталог проекта, в котором setup-uv ищет uv.lock и pyproject.toml для кэша
    required: false
    default: "."
  enable-cache:
    description: Кэш uv между запусками; проекту без зависимостей он не нужен
    required: false
    default: "auto"
runs:
  using: composite
  steps:
    # Версия uv закреплена только здесь, все workflow репозитория вызывают это действие.
    - uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "0.12.17"
        working-directory: ${{ inputs.working-directory }}
        enable-cache: ${{ inputs.enable-cache }}
